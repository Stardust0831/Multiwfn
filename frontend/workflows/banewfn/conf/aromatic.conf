#@doc module
# title.zh = 芳香性分析
# title.en = Aromaticity
# summary.zh = NICS 平面扫描与 ICSS 输入生成：根据当前分子几何布置 Bq 探针，或读取 Gaussian NMR 结果绘制 NICS 平面图。
# summary.en = Generate NICS plane-scan or ICSS Gaussian inputs from the loaded geometry, or plot NICS planes from completed Gaussian NMR results.
# notes.zh = 生成输入与读取结果是分开的阶段；本模块不会运行 Gaussian。读取时必须使用生成输入时的同一几何、网格与平面设置。
# notes.zh = 当前固定序列中的生成步骤和绘图步骤均可能停留在子菜单，不能把生成文件等同于整段流程已正常退出。
# notes.en = Input generation and result reading are separate stages; this module does not run Gaussian. Use the same geometry, grid and plane settings for both stages. The generation and plotting sequences can remain in submenus, so file creation alone does not establish that the block has exited.
#@end

#@gui ring
# label.zh = 定义环平面的原子
# label.en = Atoms defining the ring plane
# type = text
# help.zh = 当前结构中用于拟合平面及求几何中心的原子编号，如 1-6 或 3,8,10-15；应选取足以确定平面的原子。
# help.en = Atom indices used to fit the plane and locate its geometric center, e.g. 1-6 or 3,8,10-15; select enough atoms to define a plane.
#@end
#@gui grid
# label.zh = 平面网格点数
# label.en = Plane grid dimensions
# type = text
# help.zh = 两个方向的网格点数，如 100,100；留空使用 Multiwfn 的 100,100。读取 NICS 结果时须与生成输入时一致。
# help.en = Grid counts in the two plane directions, e.g. 100,100; blank uses Multiwfn's 100,100. Match the grid used to generate the NICS input.
#@end
#@gui distance
# label.zh = 扫描平面距环中心的距离
# label.en = Plane offset from the ring center
# type = text
# unit = Angstrom
# help.zh = 沿拟合平面法向的有符号偏移，默认 1；正负值位于平面两侧。读取结果时须沿用生成输入时的值。
# help.en = Signed offset along the fitted plane normal; default 1. Opposite signs select opposite sides. Reuse the value from input generation.
#@end
#@gui range
# label.zh = 扫描平面边长
# label.en = Scan plane side length
# type = text
# unit = Angstrom
# help.zh = 以偏移后的环中心为中心的正方形平面边长，默认 6；不是半径。读取结果时须与生成输入时一致。
# help.en = Side length of the square plane centered above or below the ring center; default 6. This is not a radius. Match input generation.
#@end
#@gui template
# label.zh = Gaussian NMR 输入模板
# label.en = Gaussian NMR input template
# type = file
# help.zh = NICS-2D 使用的 Gaussian 输入模板，默认 template.gjf；应含 NMR 关键词，并以 [geometry] 占位当前结构坐标。
# help.en = Gaussian template for NICS-2D, default template.gjf; include NMR keywords and use [geometry] as the placeholder for the current coordinates.
#@end
#@gui outfile
# label.zh = NICS-2D 计算输出文件
# label.en = NICS-2D calculation output
# type = file
# help.zh = 已完成 Gaussian NMR 计算、包含 Bq 磁屏蔽张量的 .log 或 .out 文件，默认 NICS_2D.log；这是输入文件路径。
# help.en = Completed Gaussian NMR .log or .out containing Bq shielding tensors; default NICS_2D.log. This is an input path.
#@end
#@gui vector
# label.zh = NICS 张量投影方向
# label.en = NICS tensor projection direction
# type = text
# help.zh = 非零方向向量 x,y,z，如 0,0,1；Multiwfn 会归一化。取环平面法向可得到垂直于环平面的 NICS 分量，此值不用于重新定义扫描平面。
# help.en = Nonzero vector x,y,z, e.g. 0,0,1; Multiwfn normalizes it. Use the ring normal for the perpendicular NICS component; it does not redefine the scan plane.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入 Multiwfn 主功能 25 的离域与芳香性分析菜单。
# summary.en = Enter Multiwfn main function 25 for delocalization and aromaticity analysis.
#@end
[main]
25

#@doc section gen2dinp
# title.zh = 生成二维 NICS 输入
# title.en = Generate NICS-2D input
# summary.zh = 生成二维 NICS 扫描输入 NICS_2D.gjf，并在输出中打印拟合平面的单位法向量。
# summary.en = Generate NICS_2D.gjf and print the fitted plane's unit normal.
# notes.zh = 需先准备 NMR 模板；Gaussian 计算完成后用相同设置调用 nics2d。
# notes.zh = 当前 Multiwfn 生成文件后仍等待选择生成或读取结果，本步骤未提供退出该子菜单的输入。
# notes.en = Prepare an NMR template first; after Gaussian finishes, call nics2d with the same settings. The generator then waits for another generation/result-reading choice; this section does not supply the input needed to leave that submenu.
#@end
[gen2dinp]
14
1
${grid:- }          # 留空使用 100,100 平面网格。
8
${ring}
${distance:-1}      # 扫描平面相对环中心的有符号偏移，Angstrom。
${range:-6}         # 正方形扫描平面的边长，Angstrom。
1
${template:-template.gjf}

#@doc section genicssinp
# title.zh = 生成 ICSS 输入
# title.en = Generate ICSS input
# summary.zh = 生成三维 ICSS 扫描的 Gaussian 输入 NICS0001.gjf、NICS0002.gjf 等。
# summary.en = Generate Gaussian inputs NICS0001.gjf, NICS0002.gjf, etc.
# notes.zh = 需读取分子几何，并提供含实际坐标的 Gaussian 模板；若启动时直接载入 .gjf，Multiwfn 会直接采用该文件，问答顺序不同。
# notes.zh = 分批大小由 settings.ini 的 NICSnptlim 决定。生成后仍等待 Gaussian 输出前缀及 ICSS 分量，当前步骤没有提供这些输入，也未导出 ICSS.cub。
# notes.en = for a three-dimensional ICSS scan. Load a geometry and provide a Gaussian template containing real coordinates. Loading a .gjf directly changes the prompt sequence because Multiwfn uses that file as the template. NICSnptlim in settings.ini sets the batch size. After generation, further prompts request the Gaussian output prefix and ICSS component; this section supplies neither and does not export ICSS.cub.
#@end
[genicssinp]
#@gui grid
# label.zh = ICSS 三维网格精度
# label.en = ICSS 3D grid quality
# type = text
# help.zh = 三维网格菜单编号：1 低、2 中、3 高，默认 2；其他选项可能需要本步骤未提供的后续网格参数。
# help.en = 3D grid menu index: 1 low, 2 medium, 3 high; default 2. Other options may require further grid inputs absent from this step.
#@end
#@gui template
# label.zh = ICSS Gaussian 输入模板
# label.en = ICSS Gaussian input template
# type = file
# help.zh = 默认 template.gjf；此分支复制模板中的实际几何坐标，不能直接沿用 NICS-2D 的 [geometry] 占位模板。
# help.en = Default template.gjf. This branch copies actual coordinates from the template; the NICS-2D [geometry] placeholder template cannot be reused directly.
#@end
3
${grid:-2}          # 三维网格菜单 2：中等精度。
n
${template:-template.gjf}

#@doc section nics2d
# title.zh = 绘制 NICS 平面图
# title.en = Plot NICS plane
# summary.zh = 读取 NICS-2D 的 Gaussian 结果，沿 vector 投影 NICS 张量，保存蓝白红填色并叠加等值线的平面图。
# summary.en = Read Gaussian NICS-2D results, project the NICS tensor along vector, and save a blue-white-red filled plane map with contours.
# notes.zh = 固定色标为 -50 至 50 ppm，坐标轴切换为 Angstrom；图片采用 Multiwfn 的 dislin 前缀及当前图像格式。
# notes.zh = 保存后仍在绘图菜单；当前 quit 未提供离开该菜单所需的 -5，后续退出须核对当前交互状态。
# notes.en = The fixed scale is -50 to 50 ppm; axes use Angstrom. Images use the dislin prefix and current Multiwfn image format. Plotting leaves the post-processing menu active; the quit sequence lacks the -5 needed to leave it, so check the interactive state before continuing.
#@end
[nics2d]
14
1
${grid:- }          # 必须匹配生成 NICS_2D.gjf 时的平面网格。
8
${ring}
${distance:-1}      # 必须匹配生成输入时的平面偏移，Angstrom。
${range:-6}         # 必须匹配生成输入时的平面边长，Angstrom。
2
${outfile:-NICS_2D.log}
0                   # 选择 NICS 张量沿指定方向的投影分量。
${vector}
4                   # 切换原子标签及参考点显示。
2                   # 标签颜色：绿色。
8                   # 切换化学键显示。
14                  # 键颜色：棕色。
-8                  # 切换图中长度单位为 Angstrom（以默认 Bohr 为起点）。
1                   # 设置色标上下限，单位 ppm。
-50,50
-2                  # 设置 X、Y、色标刻度间隔。
2,2,10
19                  # 设置颜色过渡方案。
8                   # 蓝-白-红。
17                  # 设置原子标签距平面的显示阈值。
5                   # 此提示默认仍以 Bohr 为单位，不随图轴单位改变。
n                   # 不以浅色显示超出距离阈值的原子标签。
2                   # 切换等值线显示。
3                   # 进入等值线设置。
8                   # 按起点、步长、个数生成等值线数值。
-20,15,6
y
1
0                   # 保存图像，之后仍停留在绘图菜单。

# 从离域与芳香性菜单返回主菜单并退出；不负责关闭仍在等待输入的 ICSS/NICS 绘图子菜单。
[quit]
0
q
