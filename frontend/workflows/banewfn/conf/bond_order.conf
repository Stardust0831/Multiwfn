#@doc module
# title.zh = 键级分析
# title.en = Bond orders
# summary.zh = 计算当前波函数的原子间键级，并将矩阵保存到工作目录的 bndmat.txt。
# summary.en = Compute bond orders and save bndmat.txt in the working directory.
# notes.zh = 可选 Mayer、Löwdin 正交基下的 Wiberg、Mulliken、Fuzzy 和 Laplacian 定义；不同定义的数值不宜直接混作同一种指标。
# notes.zh = Mayer/Wiberg/Mulliken 需要含基函数与轨道信息的波函数；Fuzzy/Laplacian 需要可计算实空间性质的波函数。
# notes.zh = 各计算步骤都会覆盖同名 bndmat.txt；连续比较多种方法时，应在下一次计算前保存所需结果。
# notes.en = Mayer, Wiberg in the Lowdin-orthogonalized basis, Mulliken, Fuzzy and Laplacian definitions measure different quantities. Mayer/Wiberg/Mulliken require basis and orbital information; Fuzzy/Laplacian require real-space wavefunction evaluation. Each calculation overwrites bndmat.txt; save it before comparing another method.
#@end


#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 9 的键级分析菜单。
# summary.en = Enter main function 9 for bond-order analysis.
#@end
[main]
9

#@doc section mayer
# title.zh = Mayer 键级
# title.en = Mayer bond order
# summary.zh = 计算 Mayer 键级并导出 bndmat.txt；结果依赖基组，含弥散函数时须谨慎解释。
# summary.en = Compute Mayer bond orders and export bndmat.txt.
# notes.zh = 开壳层结果还区分 alpha、beta、自旋求和及混合密度给出的矩阵，读取时应核对矩阵标题。
# notes.en = Results depend on the basis; interpret diffuse-function results with care. Open-shell output distinguishes alpha, beta, spin-summed and mixed-density matrices; check their headings.
#@end
[mayer]
1
y

#@doc section wiberg
# title.zh = Wiberg 键级
# title.en = Wiberg bond order
# summary.zh = 在 Löwdin 正交化基函数中计算 Wiberg 键级，导出 bndmat.txt。
# summary.en = Compute Wiberg bond orders in the Lowdin-orthogonalized basis and export bndmat.txt.
# notes.zh = 这是当前菜单 3 的定义，与在自然原子轨道（NAO）基中得到的 Wiberg 键级不同。
# notes.en = This is the definition in menu 3, which differs from Wiberg bond orders in the natural atomic orbital (NAO) basis.
#@end
[wiberg]
3
y

#@doc section mulliken
# title.zh = Mulliken 键级
# title.en = Mulliken bond order
# summary.zh = 计算 Mulliken 重叠布居定义的键级，导出 bndmat.txt。
# summary.en = Compute overlap-population bond orders and export bndmat.txt.
# notes.zh = 该量反映原子间重叠布居，可能为负；解释时需考虑基组依赖。
# notes.en = They can be negative and depend on the basis set.
#@end
[mulliken]
4
y

#@doc section fuzzy
# title.zh = Fuzzy 键级
# title.en = Fuzzy bond order
# summary.zh = 通过实空间模糊原子划分计算 Fuzzy 键级（FBO），导出 bndmat.txt。
# summary.en = Compute real-space fuzzy-atom bond orders (FBO) and export bndmat.txt.
# notes.zh = 可用于比较含弥散函数体系的成键，但仍需检查实空间积分的收敛性；通常比矩阵型键级耗时。
# notes.en = Useful for comparing bonding with diffuse functions; check integration convergence. Usually slower than matrix-based definitions.
#@end
[fuzzy]
7
y

#@doc section Laplacian
# title.zh = Laplacian 键级
# title.en = Laplacian bond order
# summary.zh = 在模糊原子重叠空间中积分电子密度拉普拉斯的负值部分，计算 Laplacian 键级（LBO）。
# summary.en = Integrate the negative part of the density Laplacian in fuzzy-atom overlap space to obtain LBO, exporting bndmat.txt.
# notes.zh = 导出 bndmat.txt；实空间积分较耗时，涉及重原子的键需谨慎使用，不宜套用轻元素键的解释。
# notes.en = Real-space integration is relatively costly. Interpret bonds involving heavy atoms with care rather than applying light-element expectations directly.
#@end
[Laplacian]
8
y

#@doc section writegjf
# title.zh = 导出带键级的 Gaussian 输入
# title.en = Export Gaussian connectivity
# summary.zh = 将工作目录已有的 bndmat.txt 与当前几何合并，生成含连接关系和键级的 gau.gjf，然后回到键级菜单。
# summary.en = Combine the existing bndmat.txt with the loaded geometry to generate gau.gjf with connectivity and bond orders, then return to the bond-order menu.
# notes.zh = 须先执行一种键级计算；读取的是最近保存的矩阵。生成文件含 Multiwfn 固定的计算关键词，实际提交计算前应另行检查。
# notes.en = Run a bond-order calculation first; the most recently saved matrix is used. Review the fixed Gaussian keywords before submitting the generated input.
#@end
[writegjf]
0
1000
13
9

# 从键级分析菜单返回主菜单并退出 Multiwfn。
[quit]
0
q
