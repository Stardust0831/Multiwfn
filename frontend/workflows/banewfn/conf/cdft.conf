#@doc module
# title.zh = 概念密度泛函分析
# title.en = Conceptual DFT
# summary.zh = 概念密度泛函（CDFT）分析：导出 Fukui 函数和双描述符，用于比较局部反应性。
# summary.en = Export Fukui functions and the dual descriptor for local reactivity analysis.
# notes.zh = fukui 使用 N、N+1、N-1 电子态的有限差分；ow 使用当前体系的轨道加权（OW）方法。
# notes.zh = fukui 运行前需在工作目录准备同一几何、对应电子数的 N.wfn、N+1.wfn、N-1.wfn；
# notes.zh = 缺少这些文件时 Multiwfn 会询问路径，而本模板未提供这些额外回答。
# notes.zh = ow 需要包含轨道系数及轨道能量的闭壳层单行列式波函数。分析数值还会写入本模块的 Multiwfn 日志。
# notes.en = fukui uses finite differences of the N, N+1 and N-1 electron states; ow uses orbital weighting of the loaded system. Prepare N.wfn, N+1.wfn and N-1.wfn at the same geometry in the working directory before fukui; missing files cause prompts that this template does not answer. ow requires a closed-shell single-determinant wavefunction with orbital coefficients and energies. Numerical results also appear in the Multiwfn log.
#@end


#@gui grid
# label.zh = 三维网格精度
# label.en = 3D grid quality
# type = text
# help.zh = 选择三维网格档位：1 低、2 中、3 高；越精细越耗时且文件越大。其他 setgrid 模式可能要求后续输入，本段未提供。
# help.en = 3D grid preset: 1 low, 2 medium, 3 high. Finer grids cost more time and disk space. Other setgrid modes may require further input absent from this section.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入 Multiwfn 主菜单 22：概念密度泛函分析。
# summary.en = Enter main menu 22 for conceptual DFT analysis.
#@end
[main]
22

#@doc section fukui
# title.zh = 有限差分 Fukui 函数
# title.en = Finite-difference Fukui functions
# summary.zh = 计算全局/凝聚反应性指标并写入 CDFT.txt，再导出 f+.cub、f-.cub、DD.cub。
# summary.en = Write global/condensed reactivity indices to CDFT.txt and export f+.cub, f-.cub and DD.cub.
# notes.zh = f+ 对应加电子密度变化，f- 对应去电子密度变化，DD = f+ - f-；本段不导出 f0。
# notes.en = f+ describes electron addition, f- electron removal, and DD = f+ - f-. This section does not export f0.
#@end
[fukui]
2           # export data as CDFT.txt
3
${grid:-2}
5
6
8
0

#@doc section ow
# title.zh = 轨道加权 Fukui 函数
# title.en = Orbital-weighted Fukui functions
# summary.zh = 打印凝聚 OW Fukui 函数和 OW 双描述符，导出 OW_f+.cub、OW_f-.cub、OW_DD.cub。
# summary.en = Print condensed OW Fukui functions and the OW dual descriptor; export OW_f+.cub, OW_f-.cub and OW_DD.cub.
# notes.zh = 使用当前波函数的轨道权重，不读取 N±1 电子态文件，也不写 CDFT.txt。
# notes.zh = 当前 Multiwfn 仅支持闭壳层单行列式波函数执行本段。
# notes.en = Uses the loaded orbitals without reading N+/-1 files or writing CDFT.txt. Supported for closed-shell single-determinant wavefunctions.
#@end
[ow]
6           # export data on screen
7
${grid:-2}
5
6
8
0

# 返回 Multiwfn 主菜单并退出。
[quit]
0
q
