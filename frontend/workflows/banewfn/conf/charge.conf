# summary.zh = 按 Hirshfeld 划分计算原子电荷，使用 Multiwfn 内置自由原子球平均密度，并接受 .chg 导出。
# summary.en = Compute Hirshfeld charges with Multiwfn's built-in spherical free-atom densities and accept .chg export.
#@end
[hirshfeld]
1
1
y

