# summary.en = Print Mulliken populations and charges, accept .chg export and leave the Mulliken submenu.
# notes.zh = 需要基函数及密度矩阵信息；结果对基组敏感。
# notes.en = Requires basis and density-matrix information; results depend on the basis.
#@end
[mulliken]
5
1
