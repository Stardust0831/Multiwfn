#@doc section aim
# title.zh = AIM 盆积分电荷
# title.en = AIM basin charges
# summary.zh = 生成电子密度的 AIM 原子盆，用原子中心与均匀混合网格积分，并精确细化盆边界。
# summary.en = Generate electron-density AIM basins, integrate with a mixed atom-centered/uniform grid and refine boundaries exactly.
# notes.zh = 输出归一化后的 AIM 电荷（e）、盆电子数和体积（Bohr^3）到 Multiwfn 文本输出；本路径不导出 .chg。
# notes.zh = 输入为含 GTF 与轨道占据数的普通非周期全电子波函数，例如 .wfn/.wfx/.mwfn/.fch/.molden。
# notes.zh = 每个 charge 块只运行一次 aim，且开始时须无已载入或生成的网格；当前目录不可同时有 basinana.txt 和 basinana.cub。
# notes.zh = 保持 Multiwfn 默认 ispecial=0、ibasinlocmin=0；若出现低值吸引子或无法对应原子的吸引子，须改用交互处理。
# notes.zh = 计算完成后返回电荷分析菜单，可继续同一块中的其它电荷步骤。
# notes.en = Print normalized charges (e), basin populations and volumes (Bohr^3); no .chg is exported. Use an ordinary nonperiodic all-electron wavefunction with GTFs and occupations, such as .wfn/.wfx/.mwfn/.fch/.molden. Run aim once per charge block with no grid already loaded/generated, and do not keep both basinana.txt and basinana.cub in the working directory. Keep ispecial=0 and ibasinlocmin=0; low-value or non-atomic attractors require interactive treatment. Returns to the charge menu for subsequent charge steps.
#@end
[aim]
#@gui grid
# label.zh = AIM 盆划分网格精度
# label.en = AIM basin grid quality
# type = select
# options.zh = 1:低精度 | 2:中等精度 | 3:高精度 | 4:极高精度
# options.en = 1:Low | 2:Medium | 3:High | 4:Very high
# help.zh = 默认 2；1/2/3/4 的网格间距分别为 0.20/0.10/0.06/0.04 Bohr。积分固定采用精确盆边界细化；较细网格提高划分精度并增加时间和内存开销，应检查积分归一化因子与网格收敛。
# help.en = Default 2; grid spacings for 1/2/3/4 are 0.20/0.10/0.06/0.04 Bohr. Integration uses exact basin-boundary refinement. Finer grids improve partition accuracy at higher time and memory cost; check the normalization factor and grid convergence.
#@end
0
17
1
1
${grid:-2}
7
2
1
-10
7

