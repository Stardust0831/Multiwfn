#@doc module
# title.zh = 原子电荷与布居
# title.en = Atomic charges and populations
# summary.zh = 原子电荷与布居分析：按指定划分或静电势拟合方法计算电荷，并将结果写入 Multiwfn 文本输出。
# summary.en = Compute partition-based or ESP-fitted atomic charges and print results in the Multiwfn log.
# notes.zh = 单构象计算中的 y 会接受 .chg 导出，通常生成输入文件同主名的 .chg；再次导出会覆盖同名文件。
# notes.zh = 这里的固定问答按普通非周期波函数编写；周期输入、额外自旋/原子密度提示等情形需核对实际菜单。
# notes.zh = aim 转到盆分析模块生成电子密度盆并积分，结果写入文本输出；其输入条件见该步骤说明。
# notes.en = For single conformers, y accepts .chg export, normally using the input stem; repeated exports overwrite that file. The fixed sequences assume ordinary nonperiodic inputs; periodic, spin or atomic-density prompts need separate review. aim constructs and integrates density basins; see its specific requirements.
#@end

#@gui eqvcons
# label.zh = RESP 等价电荷约束文件
# label.en = RESP charge equivalence constraints
# type = file
# help.zh = 默认 eqvcons.txt；纯文本每行写一组应具有相等电荷的原子编号，如 2,3,5-7。标准两阶段 RESP 中自定义约束只控制第一阶段。
# help.en = Default eqvcons.txt; each text line lists atoms constrained to equal charges, e.g. 2,3,5-7. Custom constraints affect only stage 1 of standard two-stage RESP.
#@end
#@gui conformers
# label.zh = RESP 构象及权重列表
# label.en = RESP conformers and weights
# type = file
# help.zh = 默认 conformers.txt；每行是构象波函数路径、空格、权重，如 conf1.fch 1.0。各构象须保持原子身份和编号一致，此固定流程要求列表实际包含多个构象。
# help.en = Default conformers.txt; each line is a conformer wavefunction path, a space, and its weight, e.g. conf1.fch 1.0. Preserve atom identities and numbering; this fixed sequence requires multiple conformers.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 7 的布居分析与原子电荷菜单。
# summary.en = Enter main function 7 for population and atomic-charge analysis.
#@end
[main]
7

