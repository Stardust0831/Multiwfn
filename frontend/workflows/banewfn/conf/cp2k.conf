#@doc module
# title.zh = 生成 CP2K 输入
# title.en = Generate CP2K input
# summary.zh = CP2K 输入文件生成：根据当前载入的结构及选定设置写出 .inp 文件，生成后需另行运行 CP2K。
# summary.en = Generate a CP2K .inp file from the loaded geometry and chosen settings; run CP2K separately afterwards.
# notes.zh = 输入须含原子坐标；净电荷、自旋多重度等取自当前体系，也可用相应步骤调整。
# notes.zh = 各处理步骤修改同一份待生成输入；最后由 [quit] 中的命令写出文件并退出。
# notes.zh = molden、ot、dft+u、eorb 均按当前设置切换状态，重复执行会再次翻转。
# notes.zh = 前序步骤会影响这些开关；tddft 还会调整 Molden 输出和 SCF 求解方式，见该步骤说明。
# notes.en = The input must contain coordinates. Charge and multiplicity come from the loaded system unless changed by a section. Sections modify the same pending input; quit writes it and exits. molden, ot, dft+u and eorb toggle their current state, so repeating them reverses the setting. Earlier steps affect these toggles; tddft also changes Molden output and the SCF solver.
#@end

#@doc section main
# title.zh = 初始化与输出路径
# title.en = Initialize and choose output
# summary.zh = 进入 CP2K 输入生成器，先指定输出文件名。
# summary.en = Enter the CP2K input generator and specify the output filename.
#@end
[main]
#@gui filename
# label.zh = 生成的 CP2K 输入文件
# label.en = Generated CP2K input file
# type = text
# help.zh = 生成的 CP2K 输入文件路径，例如 calculation.inp。留空时由 Multiwfn 按当前载入文件名生成 .inp 名称；相对路径写入当前工作目录。
# help.en = Path of the generated CP2K input, for example calculation.inp. Leave empty to let Multiwfn derive an .inp name from the loaded file; relative paths use the working directory.
#@end
cp2k
${filename:-}

#@doc section molden
# title.zh = 切换 Molden 输出
# title.en = Toggle Molden output
# summary.zh = CP2K 生成器主菜单设置
# summary.en = Toggle Molden wavefunction output after the CP2K calculation.
# notes.zh = 切换 CP2K 计算后输出 Molden 波函数文件的设置；已开启时执行本步骤会关闭。
# notes.en = Running this section when output is enabled disables it.
#@end
[molden]
-2

#@doc section D3
# title.zh = 色散修正
# title.en = Dispersion correction
# summary.zh = 选择写入 CP2K 输入的色散修正方法。
# summary.en = Choose the dispersion correction written to the CP2K input.
#@end
[D3]
#@gui D3
# label.zh = 色散修正
# label.en = Dispersion correction
# type = text
# help.zh = 输入菜单编号：0 无修正，1 DFT-D3，2 DFT-D3(BJ)，3 DFT-D4，5 rVV10。可用方法须与所选电子结构方法相适用。
# help.en = Menu index: 0 none, 1 DFT-D3, 2 DFT-D3(BJ), 3 DFT-D4, or 5 rVV10. The correction must be appropriate for the selected electronic-structure method.
#@end
3
${D3:-2}

#@doc section ot
# title.zh = 切换 OT 求解器
# title.en = Toggle OT solver
# summary.zh = 在对角化与 OT 之间切换；切入 OT 要求仅使用 Gamma 点且未开启占据数展宽。
# summary.en = Switch between diagonalization and OT. OT requires Gamma-only sampling and no occupation smearing.
#@end
[ot]
4

#@doc section tddft
# title.zh = 启用 TDDFT
# title.en = Enable TDDFT
# summary.zh = 在 TDDFT 原先关闭时启用 TDDFT（CP2K 使用 Tamm-Dancoff 近似），并选择输出 Molden 文件。
# summary.en = Enable TDDFT when it is off (CP2K uses the Tamm-Dancoff approximation), select Molden output and switch to diagonalization.
# notes.zh = 该步骤同时切换为对角化，number 控制写入 Molden 的虚轨道数；激发态数由生成器菜单 16 设置。
# notes.zh = 只应在 TDDFT 尚未开启时使用；重复执行会关闭 TDDFT，使后续 y 和 number 无法对应原有提示。
# notes.en = number sets virtual orbitals written to Molden; menu 16 sets the excited-state count. Use this section only when TDDFT is off: repeating it disables TDDFT and leaves y and number unmatched to the prompts.
#@end
[tddft]
#@gui number
# label.zh = TDDFT 后处理虚轨道数
# label.en = Virtual orbitals for TDDFT analysis
# type = text
# help.zh = 启用 TDDFT 时，为后处理求解并写入 Molden 文件的虚轨道数。输入整数，-1 表示全部；激发态数由 Multiwfn 菜单 16 另行设置。
# help.en = Number of virtual orbitals to solve and write to the Molden file when enabling TDDFT. Enter an integer; -1 requests all virtual orbitals. The excited-state count is set separately in Multiwfn menu 16.
#@end
15
y
${number:-40}

#@doc section dft+u
# title.zh = 切换 DFT+U
# title.en = Toggle DFT+U
# summary.zh = CP2K 生成器其他设置
# summary.en = Toggle DFT+U and return.
# notes.zh = 切换 DFT+U 设置并返回；已开启时会关闭。开启后须按体系检查生成文件中各 KIND 的 L 和 U_MINUS_J。
# notes.zh = 生成器使用示例 U 参数，本步骤不提供元素、角动量或 U 值输入。
# notes.en = The generator supplies example U values; review L and U_MINUS_J for each KIND in the generated input. This section does not accept element, angular-momentum or U-value entries.
#@end
[dft+u]
-9
8
0

#@doc section cutoff
# title.zh = 平面波截断
# title.en = Plane-wave cutoffs
# summary.zh = 设置平面波网格的 CUTOFF 和 REL_CUTOFF，并返回主设置菜单。
# summary.en = Set CUTOFF and REL_CUTOFF in Ry, then return to the main settings menu.
#@end
[cutoff]
#@gui cut
# label.zh = CUTOFF 与 REL_CUTOFF
# label.en = CUTOFF and REL_CUTOFF
# type = text
# help.zh = 按 CUTOFF,REL_CUTOFF 的顺序输入两个整数，例如 400,55；两个值的单位均为 Ry。
# help.en = Enter two integers in the order CUTOFF,REL_CUTOFF, for example 400,55. Both values are in Ry.
# unit = Ry
#@end
-9
5
${cut:-400,55}
0

#@doc section print
# title.zh = 打印级别
# title.en = Print level
# summary.zh = 设置 CP2K 输出信息的详细程度。
# summary.en = Set the CP2K output verbosity through PRINT_LEVEL.
#@end
[print]
#@gui level
# label.zh = CP2K 打印级别
# label.en = CP2K print level
# type = text
# help.zh = 输入菜单编号：0 SILENT（静默），1 LOW（少量），2 MEDIUM（中等），3 HIGH（详细）。写入生成文件的 PRINT_LEVEL。
# help.en = Menu index: 0 SILENT, 1 LOW, 2 MEDIUM, or 3 HIGH. This sets PRINT_LEVEL in the generated CP2K input.
#@end
-9
10
${level:-2}
0

#@doc section eorb
# title.zh = 切换轨道能输出
# title.en = Toggle orbital-energy output
# summary.zh = 切换 SCF 结束后打印轨道能量和占据数的设置；已开启时会关闭。
# summary.en = Toggle printing of orbital energies and occupations after SCF. Repeating the section reverses the setting.
#@end
[eorb]
-9
14
0

#@doc section vnumber
# title.zh = SCF 虚轨道数
# title.en = SCF virtual orbitals
# summary.zh = 设置 SCF 额外求解的虚轨道数；如需导出其波函数，还须保留 Molden 输出设置。
# summary.en = Set the extra virtual orbitals solved by SCF. Keep Molden output enabled if their wavefunctions are needed.
#@end
[vnumber]
#@gui number
# label.zh = SCF 虚轨道数
# label.en = Virtual orbitals for SCF
# type = text
# help.zh = SCF 额外求解的虚轨道数（ADDED_MOS）。输入整数：0 不增加，-1 求解全部，正整数指定数目；设置正整数时生成器会将 OT 改为对角化。
# help.en = Number of extra virtual orbitals for SCF (ADDED_MOS). Enter an integer: 0 adds none, -1 requests all, and a positive value requests that count. A positive value switches OT to diagonalization.
#@end
-9
12
${number:-30}
0

#@doc section charge
# title.zh = 体系净电荷
# title.en = Net charge
# summary.zh = 设置写入 CP2K 输入的体系净电荷。
# summary.en = Set the net charge written to the CP2K input.
#@end
[charge]
#@gui charge
# label.zh = 体系净电荷
# label.en = Net charge
# type = text
# help.zh = 输入整数净电荷，例如 0 表示中性、1 表示一价正离子、-1 表示一价负离子。覆盖从当前体系取得的净电荷。
# help.en = Integer net charge: 0 for a neutral system, 1 for a singly charged cation, or -1 for a singly charged anion. Replaces the charge obtained from the current system.
#@end
-9
1
${charge}
0

#@doc section spin
# title.zh = 自旋多重度
# title.en = Spin multiplicity
# summary.zh = 设置写入 CP2K 输入的自旋多重度。
# summary.en = Set the spin multiplicity written to the CP2K input.
#@end
[spin]
#@gui spin
# label.zh = 自旋多重度
# label.en = Spin multiplicity
# type = text
# help.zh = 输入整数 N_alpha-N_beta+1，例如 1 为单重态、2 为双重态、3 为三重态；应与体系电子数相容。
# help.en = Integer multiplicity N_alpha-N_beta+1: 1 for a singlet, 2 for a doublet, or 3 for a triplet. It must be compatible with the electron count.
#@end
-9
2
${spin}
0

[quit]
# 生成设定路径下的 CP2K 输入文件，然后退出 Multiwfn。
0
q
