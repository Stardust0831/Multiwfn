#@doc module
# title.zh = 原子色散贡献
# title.en = Atomic dispersion contributions
# summary.zh = 原子色散贡献与色散密度：基于当前几何分析各原子的色散能贡献及其空间分布。
# summary.en = Analyze atomic dispersion-energy contributions and their spatial distribution from the geometry.
# notes.zh = 当前 Multiwfn 菜单固定采用 B3LYP 参数的 DFT-D3(BJ)，不含三体项；原子能量贡献单位为 kcal/mol。
# notes.zh = 需提前在 Multiwfn settings.ini 中配置可用的 dftd3path，否则会停下询问 dftd3 程序路径。
# notes.zh = density 导出平滑后的能量密度，单位 kcal mol^-1 Bohr^-3；diff 是尚需补充网格输入的交互模板。
# notes.en = The menu uses B3LYP-parameterized DFT-D3(BJ), without the three-body term; atomic energies are in kcal/mol. Configure dftd3path in Multiwfn settings.ini first or an extra executable-path prompt appears. density exports a smoothed energy density in kcal mol^-1 Bohr^-3; diff is an interactive template needing additional grid input.
#@end


#@gui grid
# label.zh = 色散密度网格精度
# label.en = Dispersion-density grid quality
# type = text
# help.zh = 用于 density：1 低、2 中、3 高。其他网格模式可能需要额外回答；diff 段未包含 grid 输入。
# help.en = Used by density: 1 low, 2 medium, 3 high. Other grid modes may need extra answers. The diff section does not include a grid input.
#@end
#@gui atomlist
# label.zh = 两结构中对应的原子
# label.en = Corresponding atoms in both structures
# type = text
# help.zh = 原子编号从 1 开始，可写 3,8-10,20；留空选择全部原子。此值同时用于两个结构，所选原子的数量与对应顺序必须一致。
# help.en = One-based atom selection, e.g. 3,8-10,20; blank selects all atoms. The same selection is sent to both structures, so selected atoms must match in count and correspondence.
#@end
#@gui structure2
# label.zh = 参照结构文件
# label.en = Reference structure file
# type = file
# help.zh = 第二个体系的几何文件路径，例如 reference.xyz。差值为当前结构减参照结构，并按 atomlist 对应原子。
# help.en = Geometry file for the reference system, e.g. reference.xyz. Differences are current minus reference, with atoms matched by atomlist.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主菜单 21 的子菜单 4：原子对色散能的贡献。
# summary.en = Enter main menu 21, submenu 4 for atomic dispersion contributions.
#@end
[main]
21
4

#@doc section atomic
# title.zh = 原子贡献
# title.en = Atomic contributions
# summary.zh = 打印每个原子的色散能贡献，并导出 atomdisp.pqr。
# summary.en = Print each atom's dispersion-energy contribution and export atomdisp.pqr.
# notes.zh = PQR 的 charge 列存放色散能（kcal/mol），不能作为原子电荷使用。
# notes.en = The PQR charge column stores energy in kcal/mol and must not be interpreted as atomic charge.
#@end
[atomic]
1
y

#@doc section density
# title.zh = 色散能密度
# title.en = Dispersion-energy density
# summary.zh = 按所选三维网格导出 dispdens.cub，将原子色散能用归一化高斯函数平滑到空间。
# summary.en = Export dispdens.cub on the chosen grid, spreading atomic dispersion energies into space with normalized Gaussian functions.
#@end
[density]
2
${grid:-2}

#@doc section diff
# title.zh = 色散密度差
# title.en = Dispersion-density difference
# summary.zh = 比较当前结构与 structure2 的原子色散贡献，目标输出为 dispdensdiff.cub。
# summary.en = Compare atomic dispersion contributions of the loaded structure and structure2, targeting dispdensdiff.cub.
# notes.zh = 两次 atomlist 使用同一个参数，要求两结构的对应原子有相同编号顺序。
# notes.zh = 当前段在两次原子选择后结束，而 Multiwfn 随后还会询问网格设置；需补足输入才能自动运行。
# notes.en = The same atomlist selects both structures, which must have matching atom indices and order. The sequence stops after the two selections; Multiwfn then requests grid settings that must be supplied for automatic execution.
#@end
[diff]
4
${atomlist:-}
${structure2}
${atomlist:-}


# 从色散贡献菜单、能量分解菜单逐级返回，再退出 Multiwfn。
[quit]
0
0
q
