#@doc module
# title.zh = 电子态密度
# title.en = Density of states
# summary.zh = 电子态密度（DOS）与片段投影态密度（PDOS）：生成能级分布曲线、离散谱线和图像。
# summary.en = Generate DOS/fragment-PDOS curves, discrete levels and images.
# notes.zh = 片段 PDOS 需要带基函数与轨道能量的波函数，例如 fch、molden、mwfn；只有能级的文本不支持本段片段定义。
# notes.zh = 先按需重复 frag 定义各片段，再用 draw 进入作图后处理，随后选择 plottype、data 或 plot。
# notes.zh = 完整流程需包含 draw；它会调用绘图窗口，后续步骤及自动退出均从 DOS 后处理菜单继续执行。
# notes.en = Fragment PDOS requires basis and orbital-energy information, for example fch, molden or mwfn; energy-only text cannot define these fragments. Repeat frag as needed, then draw, followed by plottype, data or plot. draw opens a plot window; subsequent steps and the exit sequence start from the DOS post-processing menu.
#@end


#@gui fragindex
# label.zh = PDOS 片段编号
# label.en = PDOS fragment index
# type = text
# help.zh = 填写要定义的片段编号 1 至 10；重复 frag 可定义不同片段。编号应与后续 PDOS 曲线对应。
# help.en = Fragment slot to define, from 1 to 10. Repeat frag for different fragments; these indices identify the resulting PDOS curves.
#@end
#@gui option
# label.zh = 片段的基函数选择
# label.en = Basis-function selection for the fragment
# type = text
# help.zh = 填写一条 Multiwfn 片段选择指令，例如 a 1-6（按原子）、e C（按元素）、b 1-20（按基函数）。保留字母与编号之间的空格；本段自动追加两次 q。
# help.en = One Multiwfn fragment command, e.g. a 1-6 for atoms, e C for an element, or b 1-20 for basis functions. Keep the separating space; this section appends both q responses.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主菜单 10：DOS/PDOS 分析，保留 Multiwfn 当前的展宽、能量范围和布居设置。
# summary.en = Enter main menu 10 for DOS/PDOS, retaining current broadening, energy range and population settings.
#@end
[main]
10

#@doc section frag
# title.zh = 定义片段
# title.en = Define fragment
# summary.zh = 定义一个片段并返回 DOS 设置菜单；可重复本段建立多个片段。
# summary.en = Define one fragment and return; repeat for more fragments.
# notes.zh = 固定的两次 q 用于退出基函数选择和片段选择，适配默认 Mulliken/SCPA 基函数片段路径。
# notes.en = The two q inputs leave basis-function and fragment selection for the default Mulliken/SCPA basis-fragment path.
#@end
[frag]
-1
${fragindex}
${option}
q
q

#@doc section draw
# title.zh = 计算与显示
# title.en = Compute and display
# summary.zh = 计算并显示 DOS 图，随后停在后处理菜单；data、plot、plottype 应放在本段之后。
# summary.en = Compute and display the DOS plot, leaving the post-processing menu active. Put data, plot and plottype after this section.
#@end
[draw]
0

#@doc section plottype
# title.zh = 图像格式
# title.en = Image format
# summary.zh = 设置保存图像的格式；本段应接在 draw 之后，本身不保存图像。
# summary.en = Set the saved-image format after draw. This section does not save an image itself.
#@end
[plottype]
#@gui plottype
# label.zh = DOS 图像保存格式
# label.en = DOS image format
# type = select
# options.zh = 1:PNG | 2:GIF | 3:TIFF | 4:BMP | 5:PS | 6:EPS | 7:PDF | 8:WMF | 9:SVG
# options.en = 1:PNG | 2:GIF | 3:TIFF | 4:BMP | 5:PS | 6:EPS | 7:PDF | 8:WMF | 9:SVG
# help.zh = 默认 1（PNG）。1–4 为位图，5–9 为矢量图；本项只设置格式，需随后执行 plot 才会保存 dislin.<扩展名>，例如 dislin.png。应先执行 draw 进入 DOS 后处理菜单。
# help.en = Default 1 (PNG). Formats 1–4 are raster and 5–9 are vector. This step only sets the format; run plot afterward to save dislin.<extension>, e.g. dislin.png. Run draw first to enter DOS post-processing.
#@end
-1
${plottype:-1} # 1:png 7:pdf 9:svg

#@doc section data
# title.zh = 导出数据
# title.en = Export data
# summary.zh = 在 draw 的后处理菜单导出 DOS_curve.txt 与 DOS_line.txt。
# summary.en = Export DOS_curve.txt and DOS_line.txt from draw's post-processing menu.
# notes.zh = 第一列为能量，后续列为 TDOS 及已启用的 OPDOS/PDOS；能量单位随当前 DOS 设置。
# notes.en = Column 1 is energy; later columns contain TDOS and enabled OPDOS/PDOS. Energy units follow the current DOS settings.
#@end
[data]
3

#@doc section plot
# title.zh = 保存图像
# title.en = Save image
# summary.zh = 在 draw 的后处理菜单按当前格式保存 dislin.<扩展名>；格式由 plottype 或 Multiwfn 图像格式设置决定。
# summary.en = Save dislin.<extension> from draw's post-processing menu using the format chosen by plottype or the current Multiwfn image setting.
#@end
[plot]
2

# 从 draw 的后处理菜单返回 DOS 设置菜单，再返回主菜单并退出。
[quit]
0
-10
q
