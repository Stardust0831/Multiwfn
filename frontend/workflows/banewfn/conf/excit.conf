#@doc module
# title.zh = 电子激发分析
# title.en = Electronic excitation analysis
# summary.zh = 电子激发分析：导出空穴/电子片段贡献、自然跃迁轨道（NTO）、激发态自然轨道和片段间电荷转移（IFCT）。
# summary.en = Export hole/electron fragment contributions, NTOs, excited-state natural orbitals and IFCT results.
# notes.zh = 输入波函数应包含基函数与轨道系数，并与 logfile 中的激发组态对应；普通分子结构文件不足以完成这些分析。
# notes.zh = holeheatmap、nto 和 IFCT 固定发送态编号，按日志包含多个激发态的提示顺序编写；单态日志会跳过该提示。
# notes.zh = logfile 按首次载入激发信息的顺序提供；holeheatmap、ifctdata、no 会留下缓存，后续步骤可能不再询问文件。
# notes.zh = nto 完成后重新载入原波函数并清除缓存；组合不同步骤时应据此核对文件提示的顺序。
# notes.zh = 热图使用固定输出名，不同态的图像应及时重命名或收集；NTO 文件按态编号命名，同一态重算会覆盖。ifct 应放在本分析块最后。
# notes.en = Use a wavefunction with basis/orbital coefficients matching the excitation configurations in logfile; geometry-only files are insufficient. holeheatmap, nto and IFCT send state indices for multiple-state logs; single-state logs skip that prompt. holeheatmap, ifctdata and no cache excitation data, so later steps may not request logfile again. nto reloads the original wavefunction and clears the cache. Check prompt order when combining steps. Rename/collect fixed-name heatmaps between states; NTOs are named by state and overwritten on repetition. Put ifct last in the block.
#@end


#@gui logfile
# label.zh = 计算输出文件
# label.en = Calculation output file
# type = file
# help.zh = 与输入波函数对应、包含激发组态系数的计算输出文件，例如 Gaussian/ORCA/CP2K 输出。留空时 Multiwfn 尝试输入波函数同名的 .out/.log，缺失会继续询问。
# help.en = Calculation output containing excitation coefficients and matching the input wavefunction, such as Gaussian/ORCA/CP2K output. Blank asks Multiwfn to try the matching .out/.log; missing files cause another prompt.
#@end
#@gui state
# label.zh = 激发态编号
# label.en = Excited state index
# type = number
# help.zh = 要分析的激发态编号，从 1 开始并与 logfile 中的态序一致。holeheatmap、nto 和 IFCT 按多态日志的输入顺序编写；单态日志会跳过编号提示。
# help.en = One-based excited-state index matching logfile. The holeheatmap, nto and IFCT sequences assume a multi-state log; a single-state log skips the state prompt.
#@end
#@gui charge
# label.zh = 空穴/电子划分方法
# label.en = Hole/electron partition
# type = select
# options = 1:Mulliken | 2:Hirshfeld
# help.zh = 空穴/电子组成的划分方法：1 为 Mulliken 型，2 为 Hirshfeld。该参数不设置分子总电荷；方法应与体系及基组相适应。
# help.en = Partition of hole/electron composition: 1 Mulliken-like, 2 Hirshfeld. This does not set the molecular charge; choose a partition suitable for the system and basis.
# options.zh = 1:Mulliken 型划分 | 2:Hirshfeld 划分
# options.en = 1:Mulliken-like partition | 2:Hirshfeld partition
#@end
#@gui fragfile
# label.zh = 片段定义文件
# label.en = Fragment definition file
# type = file
# help.zh = holeheatmap 使用的片段定义文件，通常为 fragdef.txt。每行填写一个片段的原子编号，例如 1-6,9；编号从 1 开始，不写片段数量或标题行。
# help.en = Fragment-definition file for holeheatmap, usually fragdef.txt. One fragment per line, with one-based atom indices such as 1-6,9; omit a fragment-count or header line.
#@end
#@gui path
# label.zh = NTO 输出目录
# label.en = NTO output directory
# type = directory
# help.zh = nto 保存 <state>_NTO.fch 的目录；填写目录而不是完整文件名。目录需已存在，点号表示当前任务工作目录。
# help.en = Existing directory for <state>_NTO.fch. Supply a directory, not a full filename; a dot denotes the current job working directory.
#@end
#@gui fragdef
# label.zh = IFCT 片段定义文件
# label.en = IFCT fragment-definition file
# type = text
# help.zh = ifctdata/ifct 读取的片段定义文件路径，不是直接填写原子列表。每行一个片段的原子编号，例如 1-6,9；不写片段数量或标题行。
# help.en = Path to the fragment-definition file read by ifctdata/ifct, not an atom list entered directly. Use one fragment per line, e.g. 1-6,9, without a fragment-count or header line.
#@end
#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主菜单 18：电子激发分析。
# summary.en = Enter main menu 18 for electronic excitation analysis.
#@end
[main]
18

#@doc section holeheatmap
# title.zh = 片段空穴电子热图
# title.en = Fragment hole/electron heatmap
# summary.zh = 按所选布居方法计算空穴/电子组成，读取 fragfile，导出 he_frag.txt 和贡献热图 dislin.pdf。
# summary.en = Compute hole/electron populations using the chosen method, read fragfile, and export he_frag.txt and dislin.pdf.
# notes.zh = fragfile 是每行一个片段的原子编号文件；这里使用 fragfile 参数，不使用 IFCT 的 fragdef。
# notes.en = fragfile lists one fragment's atom indices per line; this section uses fragfile rather than IFCT's fragdef.
#@end
[holeheatmap]
1
${logfile:-}
${state:-1}
3
${charge:-1}             # 1=mulliken 2=hirshfeld
-1
0
${fragfile:-fragdef.txt}
2                        # Export data
3                        # Save picture
0
0

#@doc section nto
# title.zh = 自然跃迁轨道
# title.en = Natural transition orbitals
# summary.zh = 对指定激发态生成 NTO，导出到 path/<state>_NTO.fch。
# summary.en = Generate NTOs for the chosen state and export path/<state>_NTO.fch.
# notes.zh = 文件中原先记录轨道能量的位置存放 NTO 本征值；后续绘制轨道需重新载入该文件。
# notes.en = NTO eigenvalues occupy the orbital-energy entries; reload this file for orbital plotting.
#@end
[nto]
6
${logfile:-}
${state:-1}
2
${path:-.}/${state:-1}_NTO.fch

#@doc section no
# title.zh = 激发态自然轨道
# title.en = Excited-state natural orbitals
# summary.zh = 从指定激发态的密度矩阵生成自然轨道，导出 NO_<四位态编号>.mwfn，例如 NO_0001.mwfn。
# summary.en = Generate natural orbitals from the selected excited-state density matrix and export NO_<four-digit state>.mwfn, for example NO_0001.mwfn.
# notes.zh = 本段生成的是激发态自然轨道，轨道占据数描述该激发态；与 nto 的跃迁轨道用途不同。
# notes.en = Occupations describe that excited state; these orbitals serve a different purpose from NTOs.
#@end
[no]
13
${logfile:-}
${state:-1}

#@doc section ifctdata
# title.zh = 片段电荷转移数据
# title.en = Fragment charge-transfer data
# summary.zh = 读取 fragdef，打印片段空穴/电子贡献、片段间转移电子数以及局域激发/电荷转移百分比。
# summary.en = Read fragdef and print fragment hole/electron contributions, transferred-electron counts and local/charge-transfer excitation percentages in the Multiwfn log.
# notes.zh = 数值写入本模块的 Multiwfn 日志；本段不自动创建 ifctdata.txt，也不绘制转移矩阵热图。
# notes.en = Does not create ifctdata.txt or a transfer-matrix heatmap.
#@end
[ifctdata]
8
${charge:-1}             # 1=mulliken 2=hirshfeld
${logfile:-}
${state:-1}
0
${fragdef:-}
0

#@doc section ifct
# title.zh = 片段电荷转移矩阵
# title.en = Fragment charge-transfer matrix
# summary.zh = 先生成原子间电荷转移矩阵 atmCTmat.txt，再按 fragdef 汇总并保存热图及 tmat.txt。
# summary.en = Generate atmCTmat.txt, aggregate by fragdef, and save the heatmap and tmat.txt.
# notes.zh = 本段会切换到矩阵绘图路径；应作为当前 excit 分析块的最后一步，后续分析另开一个块。
# notes.en = This switches into matrix plotting; put it last in the excit block and start a new block for later analyses.
#@end
[ifct]
8
${charge:-1}             # 1=mulliken 2=hirshfeld
${logfile:-}
${state:-1}
-1
2
atmCTmat.txt
-1
0
${fragdef:- }
2
3
0

# 从激发分析菜单返回并退出 Multiwfn；需先完成各步骤所要求的文件和状态输入。
[quit]
0
q

# 执行 holeheatmap 时登记空穴/电子分析文献；这里的绑定不发送给 Multiwfn。
[citations]
liu_hole_2020 @holeheatmap
