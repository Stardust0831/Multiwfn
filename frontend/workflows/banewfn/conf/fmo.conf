#@doc module
# title.zh = 分子轨道网格
# title.en = Molecular orbital grids
# summary.zh = 导出分子轨道波函数的 cube 网格，用于查看前线轨道或指定轨道的空间分布。
# summary.en = Export orbital wavefunction values to cube files for frontier or selected orbitals.
# notes.zh = 输入须含轨道波函数；这里生成的是轨道值而非轨道电子密度。orb 接受前线轨道标签，orb_num 接受数字编号。
# notes.zh = 文件输出到当前工作目录；scripts/gui/MO/fmo.bwc 等工作流再负责重命名和整理。
# notes.en = Requires orbital wavefunctions; the values are orbital amplitudes rather than electron densities. orb accepts frontier labels and orb_num accepts numeric indices. Files go to the working directory; workflows such as scripts/gui/MO/fmo.bwc rename and collect them.
#@end

#@gui grid
# label.zh = 轨道 cube 网格精度
# label.en = Orbital cube grid quality
# type = text
# help.zh = Multiwfn 三维网格菜单编号：1 低、2 中、3 高，默认 2；其他网格选项可能需要本步骤没有提供的后续输入。
# help.en = Multiwfn 3D grid menu index: 1 low, 2 medium, 3 high; default 2. Other grid modes may need additional inputs absent from this step.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 200 的其他功能第二部分。
# summary.en = Enter main function 200, the second group of other functions.
#@end
[main]
200

#@doc section orb
# title.zh = 按标签导出轨道
# title.en = Export orbital by label
# summary.zh = 按一个前线轨道标签导出 cube，如 h.cub、h-1.cub 或 la.cub。
# summary.en = Export one frontier orbital as h.cub, h-1.cub, la.cub, etc.
# notes.zh = 标签模式适用于 Multiwfn 可识别 HOMO/LUMO 的单行列式输入；数字编号须使用 orb_num，以匹配额外的输出方式问答。
# notes.en = Labels require a single-determinant input for which Multiwfn identifies HOMO/LUMO. Use orb_num for numeric indices to answer its extra output-mode prompt.
#@end
[orb]
#@gui index
# label.zh = 前线轨道标签
# label.en = Frontier orbital label
# type = text
# help.zh = 每次填写一个标签；闭壳层如 h、h-1、l、l+1，非限制性如 ha、hb、la、lb。默认 h；不要在本步骤填写数字列表。
# help.en = One label per call: h, h-1, l, l+1 for closed shells; ha, hb, la, lb for unrestricted wavefunctions. Default h; use orb_num for numeric lists.
#@end
3
${index:-h}
${grid:-2}

#@doc section orb_num
# title.zh = 按编号导出轨道
# title.en = Export orbitals by index
# summary.zh = 按数字编号导出一个或多个轨道，每个轨道单独写入 orb000001.cub 一类文件，数字部分为六位全局轨道编号。
# summary.en = Export one or more selected orbitals separately as orb000001.cub etc., using six-digit global indices.
# notes.zh = 适合自然轨道等不宜使用 HOMO/LUMO 标签的输入；须明确提供编号，留空不代表选择所有轨道。
# notes.en = Suitable for natural orbitals without HOMO/LUMO labels. Supply explicit indices; empty input does not select all orbitals.
#@end
[orb_num]
#@gui index
# label.zh = 轨道数字编号列表
# label.en = Numeric orbital indices
# type = text
# help.zh = 单个编号或逗号与范围组合，如 5 或 1,3-6,8；使用 Multiwfn 的全局轨道编号，须填写，勿使用 h/l 标签。
# help.en = One index or a comma/range list, e.g. 5 or 1,3-6,8. Supply Multiwfn global orbital indices; h/l labels do not match this step's output prompt.
#@end
3
${index:-}
${grid:-2}
1

# 从其他功能菜单返回主菜单并退出 Multiwfn。
[quit]
0
q

# 声明进入本模块时绑定的前线分子轨道理论文献；此段不向 Multiwfn 发送命令。
[citations]
fukui_fmo_1952 @main
