#@doc module
# title.zh = 三维实空间网格
# title.en = Real-space grids
# summary.zh = 三维实空间网格：从波函数生成密度、ELF、LOL、ESP、ALIE 或 LEAE 的 cube 文件。
# summary.en = Generate density, ELF, LOL, ESP, ALIE or LEAE cube files from a wavefunction.
# notes.zh = 输入应包含所需轨道信息；LEAE 还需要虚轨道及轨道能量。输出默认写到当前任务目录，重复执行同一步骤会覆盖同名文件。
# notes.zh = esp 重新读入生成的 cube，原波函数随之被替换，必须放在本模块全部计算步骤的最后。
# notes.zh = 通用网格菜单还支持点数/步长、原点/中心、原子范围、沿用 cube、周期晶胞及图形设盒等方式；这些模式需要后续回答。
# notes.zh = 本模板表单提供 1/2/3 自动档位。使用其他模式时需在原始输入或扩展模板中完整提供后续命令。
# notes.en = Supply the required orbitals; LEAE also needs virtual orbitals and energies. Files go to the task directory and repeated steps overwrite them. esp reloads its cube and replaces the wavefunction, so it must run last in this module. The form provides automatic grid presets 1/2/3. Other grid modes (counts/spacing, origin/center, atom ranges, existing cubes, cells or graphical boxes) need additional answers in raw input or an extended template.
#@end

#@gui grid
# label.zh = 三维网格精度
# label.en = 3D grid quality
# type = select
# options.zh = 1:低精度 | 2:中等精度 | 3:高精度
# options.en = 1:Low | 2:Medium | 3:High
# help.zh = 本模板表单的自动网格档位：1 低、2 中、3 高。非周期体系约为 12.5 万、51.2 万、172.8 万点；默认 electron/elf/lol/alie/leae=3，spin=2，esp=1。Multiwfn 其他网格模式还需后续输入，应在原始输入或扩展模板中设置。
# help.en = Automatic grid presets offered by this form: 1 low, 2 medium, 3 high. For nonperiodic systems these target about 125000, 512000, or 1728000 points. Defaults: 3 for electron/elf/lol/alie/leae, 2 for spin, 1 for esp. Other Multiwfn grid modes require additional answers in raw input or an extended template.
#@end
#@gui operator
# label.zh = 运算符与第二个波函数
# label.en = Operator and second wavefunction
# type = text
# help.zh = wfn2 必填，格式为 运算符,文件路径，例如 -,reference.fchk；支持 +、-、*、/。对当前输入与第二个文件的同一实空间函数逐点运算。wfn2 应紧接在要计算的步骤之前，重新进入三维网格菜单会清除这项设置。
# help.en = Required by wfn2. Enter operator,path, for example -,reference.fchk; supported operators are +, -, *, /. Combines the same real-space function from the loaded and external systems point by point. Place wfn2 immediately before the target calculation; re-entering the 3D grid menu clears the operation.
#@end
#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 5，选择并计算三维实空间函数；工作流自动加入此初始化段。
# summary.en = Enter main function 5 for real-space grid calculation; workflows add this initialization automatically.
#@end
[main]
5

#@doc section wfn2
# title.zh = 第二个波函数运算
# title.en = Second-wavefunction operation
# summary.zh = 为紧随其后的网格计算设置与一个外部波函数文件的加、减、乘或除；本段本身不导出文件。
# summary.en = Set addition, subtraction, multiplication or division with an external wavefunction for the immediately following grid calculation. This section does not export a file itself.
#@end
[wfn2]
0
1
${operator}

#@doc section electron
# title.zh = 电子密度
# title.en = Electron density
# summary.zh = 计算总电子密度 rho。
# summary.en = Compute total electron density rho.
# outputs.zh = density.cub；密度单位为 e/Bohr^3。
# outputs.en = density.cub; density in e/Bohr^3.
#@end
[electron]
1
${grid:-3}
2
0
5

#@doc section spin
# title.zh = 自旋密度
# title.en = Spin density
# summary.zh = 计算自旋密度 rho_alpha-rho_beta，通常用于开壳层体系。
# summary.en = Compute rho_alpha-rho_beta, commonly for open-shell systems.
# outputs.zh = spindensity.cub；密度单位为 e/Bohr^3。
# outputs.en = spindensity.cub; density in e/Bohr^3.
#@end
[spin]
5
${grid:-2}
2
0
5

#@doc section elf
# title.zh = 电子局域函数
# title.en = Electron localization function
# summary.zh = 计算电子局域函数 ELF。
# summary.en = Compute the electron localization function ELF.
# outputs.zh = ELF.cub；函数值无量纲。
# outputs.en = ELF.cub; dimensionless values.
#@end
[elf]
9
${grid:-3}
2
0
5

#@doc section lol
# title.zh = 局域轨道定位函数
# title.en = Localized orbital locator
# summary.zh = 计算局域轨道定位函数 LOL。
# summary.en = Compute the localized orbital locator LOL.
# outputs.zh = LOL.cub；函数值无量纲。
# outputs.en = LOL.cub; dimensionless values.
#@end
[lol]
10
${grid:-3}
2
0
5

#@doc section esp
# title.zh = 静电势
# title.en = Electrostatic potential
# summary.zh = 计算总静电势，并将数值乘以 627.51，由原子单位换为 kcal/mol。
# summary.en = Compute total ESP and multiply values by 627.51 to convert atomic units to kcal/mol.
# outputs.zh = totesp.cub；数值单位为 kcal/mol。
# outputs.en = totesp.cub; values in kcal/mol.
# notes.zh = 此步重新加载 totesp.cub，原波函数随之被替换，必须放在本模块最后。结果已换算单位，后处理改名时不要再次乘换算因子。
# notes.en = This step reloads totesp.cub and replaces the wavefunction, so put it last in the module. Values are already converted; renaming must not apply the conversion again.
#@end
[esp]
12
${grid:-1}
2
0
r
totesp.cub
13
11
5
627.51
0
totesp.cub
-1
5

#@doc section alie
# title.zh = 平均局部电离能
# title.en = Average local ionization energy
# summary.zh = 计算平均局部电离能 ALIE。
# summary.en = Compute the average local ionization energy ALIE.
# outputs.zh = avglocion.cub；能量保持 Hartree，未换为 eV。
# outputs.en = avglocion.cub; energies remain in Hartree, without conversion to eV.
#@end
[alie]
18
${grid:-3}
2
0
5

#@doc section leae
# title.zh = 局部电子附着能
# title.en = Local electron attachment energy
# summary.zh = 将用户自定义函数设为 -27，计算局部电子附着能 LEAE。
# summary.en = Set user-defined function -27 and compute local electron attachment energy LEAE.
# inputs.zh = 需要能量为负的未占据轨道；输入须保留所需虚轨道与轨道能量，例如完整 fchk 或 molden 文件。
# inputs.en = Requires negative-energy unoccupied orbitals. Retain the necessary virtual orbitals and energies, for example in a complete fchk or molden file.
# outputs.zh = userfunc.cub；能量单位为 Hartree。
# outputs.en = userfunc.cub; energies in Hartree.
#@end
[leae]
-10
1000
2
-27
5
100
${grid:-3}
2
0
5

# 从三维网格菜单返回主菜单并退出；工作流非交互执行时自动追加。
[quit]
-10
q

# esp 步骤的参考文献绑定。
[citations]
zhang_esp_2021 @esp
