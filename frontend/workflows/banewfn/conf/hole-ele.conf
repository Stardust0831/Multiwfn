#@doc module
# title.zh = 空穴电子分析
# title.en = Hole-electron analysis
# summary.zh = 激发态空穴–电子分析：由波函数和对应的激发计算输出读取跃迁组态，计算指定态的密度分布与分离/重叠指标。
# summary.en = Read a wavefunction and matching excitation configurations to compute hole/electron densities, separation and overlap measures for a selected state.
# notes.zh = 波函数需包含基组与轨道系数，例如 fchk；logfile 需包含同一体系、同一轨道约定的激发信息。
# notes.zh = 此序列固定发送 state，适用于会询问态编号的多态输出；只有一个激发态时当前 Multiwfn 会跳过该提问，需另行调整原始输入。
# notes.zh = 导出的 cube 默认不带态编号，循环多个激发态时应在各轮结束后收集或改名。
# notes.en = Supply basis/orbital coefficients (for example fchk) and a logfile with matching orbital conventions. The fixed state input assumes a multiple-state log; a single-state log skips that prompt and needs adjusted raw input. Exported cubes lack state indices, so rename or collect them after each state.
#@end

#@gui logfile
# label.zh = 激发计算输出文件
# label.en = Excited-state calculation output
# type = file
# help.zh = 含激发能与跃迁组态系数的计算输出路径，如 Gaussian/ORCA/CP2K 输出或 Multiwfn 支持的文本。需与当前波函数对应；留空时程序尝试同名 .out，再尝试 .log，找不到会继续等待输入。
# help.en = Path to calculation output containing excitation energies and transition coefficients, such as supported Gaussian/ORCA/CP2K output or a Multiwfn text file. It must match the loaded wavefunction. Empty tries the same basename with .out, then .log; a missing file causes another input prompt.
#@end
#@gui state
# label.zh = 激发态序号
# label.en = Excited-state index
# type = text
# help.zh = 默认 1，按激发输出中读取到的态列表从 1 编号；不是自旋多重度。此序列适用于包含多个态的输出；若只加载一个态，Multiwfn 不读取本项，原命令序列会错位。
# help.en = Default 1; a positive index in the state list loaded from the excitation output, not a spin multiplicity. This sequence assumes multiple states. When only one state is loaded, Multiwfn skips this input and the existing command sequence becomes misaligned.
#@end
#@gui grid
# label.zh = 空穴–电子三维网格
# label.en = Hole-electron 3D grid
# type = text
# help.zh = 默认 2；1/2/3 为低/中/高自动网格。指标和 cube 都由该网格积分/采样得到，精度也影响 Cele 步骤的计算量。其他自定义网格模式需在原始输入或扩展模板中提供其后续回答。
# help.en = Default 2; 1/2/3 are low/medium/high automatic grids. Both descriptors and cubes use this grid, and its resolution also affects the cost of Cele. Other custom grid modes require their follow-up answers in raw input or an extended template.
#@end
#@doc section main
# title.zh = 载入激发态并生成网格
# title.en = Load state and generate grid
# summary.zh = 进入电子激发分析，加载激发数据、选态并生成三维网格；分离距离、Sm/Sr 等指标同时写入运行输出。
# summary.en = Enter excitation analysis, load data, choose a state and generate the 3D grid. Separation distances and Sm/Sr measures also appear in the log.
#@end
[main]
18
1
${logfile:-}        # 输出文件
${state:-1}
1
${grid:-2}

#@doc section cub
# title.zh = 空穴与电子密度
# title.en = Hole and electron densities
# summary.zh = 导出空穴与电子密度。
# summary.en = Export hole and electron densities.
# outputs.zh = hole.cub、electron.cub。
# outputs.en = hole.cub and electron.cub.
# notes.zh = 同一个 choice 同时用于空穴和电子，可选择总分布、局域项或交叉项。
# notes.en = The same choice selects total, local or cross terms for both distributions.
#@end
[cub]
#@gui choice
# label.zh = 空穴与电子分布的组成
# label.en = Hole and electron distribution terms
# type = text
# help.zh = 默认 1=总分布（局域项+交叉项）；2=仅局域项；3=仅交叉项。通常用 1 讨论整体空穴/电子分布，2/3 用于拆分分析；无论选择哪一项，文件名均为 hole.cub 和 electron.cub。
# help.en = Default 1 is the total distribution (local plus cross terms); 2 exports only local terms; 3 exports only cross terms. Use 1 for the overall hole/electron distribution and 2/3 for decomposition. Filenames remain hole.cub and electron.cub.
#@end
10
${choice:-1}         # 1=total 2=local 3=cross
11
${choice:-1}

#@doc section overlap
# title.zh = 空穴电子重叠
# title.en = Hole-electron overlap
# summary.zh = 导出空穴–电子重叠函数：1 为 Sm=min(rho_h,rho_e)，输出 Sm.cub；2 为 Sr=sqrt(rho_h*rho_e)，输出 Sr.cub。
# summary.en = Export an overlap function: 1 gives Sm=min(rho_h,rho_e) in Sm.cub; 2 gives Sr=sqrt(rho_h*rho_e) in Sr.cub.
#@end
[overlap]
#@gui func
# label.zh = 空穴–电子重叠函数
# label.en = Hole-electron overlap function
# type = select
# options.zh = 1:Sm（取两种密度的较小值） | 2:Sr（两种密度乘积的平方根）
# options.en = 1:Sm (minimum of the two densities) | 2:Sr (square root of their product)
# help.zh = 默认 2（Sr，也是 Multiwfn 推荐项）。1 导出 Sm=min(rho_h,rho_e) 到 Sm.cub；2 导出 Sr=sqrt(rho_h*rho_e) 到 Sr.cub。使用初始化步骤已计算的空穴和电子总密度；此处导出空间函数，其全空间积分才是对应的 Sm/Sr 指标。
# help.en = Default 2 (Sr, also recommended by Multiwfn). 1 writes Sm=min(rho_h,rho_e) to Sm.cub; 2 writes Sr=sqrt(rho_h*rho_e) to Sr.cub. Uses the total hole and electron densities calculated during initialization. These are spatial functions; their integrals over all space are the Sm/Sr indices.
#@end
12
${func:-2}           # 1=Sm 2=Sr

#@doc section transdens
# title.zh = 跃迁密度
# title.en = Transition density
# summary.zh = 导出跃迁密度 transdens.cub，用于检查跃迁振幅的空间分布与正负相位。
# summary.en = Export transdens.cub to inspect the spatial distribution and signs of transition amplitudes.
#@end
[transdens]
13

#@doc section tdm
# title.zh = 跃迁偶极矩密度
# title.en = Transition dipole moment density
# summary.zh = 导出所选跃迁电偶极矩密度分量到 transdipdens.cub；各分量重复执行时复用同一文件名。
# summary.en = Export the chosen transition electric-dipole density component to transdipdens.cub. Repeated component exports overwrite that filename.
#@end
[tdm]
#@gui component
# label.zh = 跃迁电偶极矩密度分量
# label.en = Transition dipole density component
# type = text
# help.zh = 默认 1=X；2=Y；3=Z；4=模长 sqrt(x^2+y^2+z^2)。分量与当前分子坐标系及原点对应；输出始终为 transdipdens.cub。
# help.en = Default 1=X; 2=Y; 3=Z; 4=norm sqrt(x^2+y^2+z^2). Components follow the current molecular coordinate system and origin. Output is always transdipdens.cub.
#@end
14
${component:-1}   # 1=x, 2=y, 3=z, 4=Norm, sqrt(x^2+y^2+z^2)

#@doc section cdd
# title.zh = 电荷密度差
# title.en = Charge density difference
# summary.zh = 计算电子分布减空穴分布的电荷密度差。
# summary.en = Compute electron minus hole density.
# outputs.zh = CDD.cub；正值对应密度增加，负值对应密度减少。
# outputs.en = CDD.cub; positive values indicate density gain and negative values density loss.
#@end
[cdd]
15

#@doc section Cele
# title.zh = 高斯分布与库仑吸引
# title.en = Gaussian distributions and Coulomb attraction
# summary.zh = 导出 Cele.cub、Chole.cub：用各分布的中心与三个方向的展宽构造归一化高斯分布，不是对原 cube 逐点平滑。
# summary.en = Export Cele.cub and Chole.cub as normalized Gaussians built from distribution centers and widths along three axes, rather than pointwise smoothing of the original cubes.
# notes.zh = 本段还执行菜单 18，计算这两个高斯分布的库仑吸引能大小并写入运行输出（a.u. 和 eV）；细网格会明显增加耗时。
# notes.en = Menu 18 also computes their Coulomb-attraction magnitude in a.u. and eV in the log. Fine grids can be costly.
#@end
[Cele]
16

18

# 依次退出后处理、空穴–电子和激发分析菜单，再退出 Multiwfn。
[quit]
0
0
0
q

# 本模块初始化步骤的空穴–电子分析参考文献绑定。
[citations]
liu_hole_2020 @main
