#@doc module
# title.zh = 轨道组成分析
# title.en = Orbital composition
# summary.zh = 分析原子及自定义片段对分子轨道的贡献，结果写入 Multiwfn 文本输出。
# summary.en = Analyze atomic and fragment contributions to orbitals in the Multiwfn log.
# notes.zh = 默认以 Hirshfeld 划分和内置自由原子球平均密度计算；需要含轨道信息、可计算实空间轨道值的波函数。
# notes.zh = 先按需用 def_frag 定义片段，再用 print 查看轨道；片段定义在本次模块运行中持续生效。
# notes.en = The default uses Hirshfeld partitioning and built-in spherical free-atom densities; requires orbitals evaluable in real space. Define fragments with def_frag before print if needed. Definitions persist within this module invocation.
#@end

#@gui method
# label.zh = 轨道成分分析方法编号
# label.en = Orbital composition method index
# type = number
# help.zh = 默认 8，即 Hirshfeld 原子/片段贡献。随后固定回答 1 选择内置原子密度；改成其他菜单编号时须核对后续问答，不能只替换方法号。
# help.en = Default 8 selects Hirshfeld atom/fragment contributions. The following fixed 1 selects built-in atomic densities; other method indices may require a different input sequence.
#@end
#@gui fragdef
# label.zh = 片段原子编号
# label.en = Fragment atom indices
# type = text
# help.zh = 当前分子的原子编号，如 1,3-6,8；不是文件名或轨道编号。首次定义应填写非空列表，已有片段时 0 表示保留原定义。
# help.en = Atom indices in the current molecule, e.g. 1,3-6,8; not a filename or orbital list. Use a nonempty list for the first definition; 0 preserves an existing fragment.
#@end
#@gui index
# label.zh = 待分析轨道
# label.en = Orbital to analyze
# type = text
# help.zh = 每次填写一个轨道编号，如 5；非限制性 beta 轨道可用 5b，也可在适用输入中使用 h/l、ha/hb/la/lb 等前线轨道标签。留空不表示全部轨道。
# help.en = One orbital index per call, e.g. 5; use 5b for unrestricted beta orbitals, or supported frontier labels such as h/l and ha/hb/la/lb. Blank does not mean all orbitals.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 8，选择 method，并按默认 Hirshfeld 路径使用内置原子密度。
# summary.en = Enter main function 8, select method, and use built-in atom densities along the default Hirshfeld route.
#@end
[main]
8
${method:-8}    # 当前轨道成分菜单 8：Hirshfeld。
1               # Hirshfeld 分支中选择内置自由原子球平均密度。

#@doc section def_frag
# title.zh = 定义片段
# title.en = Define fragment
# summary.zh = 定义或替换用于汇总轨道贡献的原子片段；首次使用时必须提供 fragdef。
# summary.en = Define or replace a fragment for orbital-contribution sums; supply fragdef on first use.
# notes.zh = 后续 print 除逐原子结果外，还会打印该片段的总贡献和片段内的轨道离域指数。
# notes.en = Subsequent print steps add fragment contributions and intra-fragment orbital delocalization indices to atomic results.
#@end
[def_frag]
-9
${fragdef:-}

#@doc section print
# title.zh = 输出轨道贡献
# title.en = Print orbital contributions
# summary.zh = 打印指定轨道的能量、占据数、原子贡献百分比及轨道离域指数；已定义片段时同时报告片段贡献。
# summary.en = Print the orbital energy, occupation, atomic percentages and delocalization index, plus fragment contributions when defined.
# notes.zh = 正常的单轨道查询不会生成独立结果文件，可重复调用以分析多个轨道。
# notes.en = Ordinary single-orbital queries create no separate file; repeat for additional orbitals.
#@end
[print]
${index:-}


# 依次退出轨道成分结果界面、主功能 8 菜单和 Multiwfn。
[quit]
0
-10
q
