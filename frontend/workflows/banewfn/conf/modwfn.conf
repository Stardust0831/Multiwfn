#@doc module
# title.zh = 轨道基本信息
# title.en = Orbital information
# summary.zh = 查看当前波函数的轨道基本信息，供轨道编号核对及后续工作流提取使用。
# summary.en = List orbital information for index checking and subsequent workflow extraction.
# notes.zh = 虽然入口属于 Multiwfn 的波函数检查与修改菜单，本文件封装的 orblist 只列出信息，不修改波函数。
# notes.zh = 需要含轨道信息的输入；结果进入 Multiwfn 文本输出，本模块不自行生成 OrbList.txt。
# notes.en = orblist only lists information within the wavefunction inspection/modification menu. Requires orbital data. Results go to the Multiwfn log; this module does not create OrbList.txt.
#@end


#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 6 的波函数检查与修改菜单。
# summary.en = Enter main function 6 for wavefunction inspection and modification.
#@end
[main]
6

#@doc section orblist
# title.zh = 列出轨道
# title.en = List orbitals
# summary.zh = 列出所有轨道的编号、能量（Hartree/eV）、占据数、自旋类型及可用的对称性标签。
# summary.en = List orbital indices, energies (Hartree/eV), occupations, spin types and available symmetry labels.
# notes.zh = 非限制性 beta 轨道还会打印从第一个 beta 轨道起计的编号；scripts/gui/MO/fmo.bwc 等脚本会从此输出另行提取轨道列表。
# notes.en = Unrestricted beta orbitals also have indices counted from the first beta orbital. Workflows such as scripts/gui/MO/fmo.bwc extract orbital lists from this text separately.
#@end
[orblist]
3

# 从波函数检查与修改菜单返回主菜单并退出 Multiwfn。
[quit]
-1
q
