#@doc module
# title.zh = NBO 密度拟合
# title.en = NBO density fitting
# summary.zh = 将密度差、Fukui 函数或其他 cube 网格拟合为 NBO 轨道密度的线性组合，报告各轨道贡献并导出拟合网格。
# summary.en = Fit a density-difference, Fukui or other cube as a linear combination of NBO orbital densities and export the fit.
# notes.zh = 输入应为 NBO 程序生成的 .31 文件，并在同一位置准备同主名 .37（NBO 系数）；main 中的 37 用于文件载入阶段。
# notes.zh = 本模块不会生成 NBO。目标 cube 的结构与坐标系须与 NBO 输入一致，拟合系数的含义取决于所提供的目标网格。
# notes.en = Load an NBO .31 file with a same-stem .37 coefficient file beside it; main's 37 answers the loading prompt. This module does not generate NBOs. The target cube must share the NBO geometry and coordinate frame; coefficients depend on its definition.
#@end

#@gui den_cub
# label.zh = 待拟合的网格文件
# label.en = Target grid cube file
# type = file
# help.zh = 密度差、Fukui 函数或其他待拟合网格，默认 density.cub；文件须已存在，并与 NBO 使用相同的结构和坐标系。
# help.en = Existing cube of density difference, Fukui function, or other target data; default density.cub. Match the NBO geometry and coordinate frame.
#@end
#@gui constraint
# label.zh = 轨道贡献系数总和
# label.en = Sum of orbital contribution coefficients
# type = text
# help.zh = 拟合时强制各轨道贡献系数之和等于此数，默认 1；应按目标网格的定义和归一化选择，不是轨道数或 NBO 占据数。
# help.en = Constrain the sum of fitted orbital coefficients to this value; default 1. Choose it for the target grid's definition and normalization, not as an orbital count or NBO occupation.
#@end
#@gui NBOtype
# label.zh = 参与拟合的 NBO 编号
# label.en = NBO indices included in the fit
# type = text
# help.zh = 留空选择全部轨道，o 选择占据数非零的轨道，也可输入 2,3,7-10 一类编号列表；这是轨道选择，不是 NBO 文件后缀。
# help.en = Blank selects all orbitals; o selects nonzero-occupation orbitals; a list such as 2,3,7-10 selects specific indices. This is not an NBO filename suffix.
#@end

#@doc section main
# title.zh = 载入 NBO 系数
# title.en = Load NBO coefficients
# summary.zh = 在读取 .31 时选择同主名 .37 中的 NBO；普通 .fch/.mwfn 载入后没有此提示，不能直接套用本入口。
# summary.en = Choose the same-stem .37 NBO coefficients while reading .31. Ordinary .fch/.mwfn loading lacks this prompt and cannot use this entry sequence directly.
#@end
[main]
37

#@doc section denfit
# title.zh = 拟合目标网格
# title.en = Fit target grid
# summary.zh = 进入主功能 200 的轨道贡献拟合，指定系数总和约束并在默认内存模式下拟合 den_cub。
# summary.en = Enter main function 200's orbital-contribution fitting, constrain the coefficient sum and fit den_cub in the default memory mode.
# notes.zh = 贡献系数和误差写入文本输出；拟合网格固定保存为 fitted.cub，随后返回 Multiwfn 主菜单。
# notes.en = Print coefficients and errors, save fitted.cub and return to the main menu.
#@end
[denfit]
200
13
${den_cub:-density.cub}
1
2
${constraint:-1}
0
${NBOtype:-}    # 空值选择所有轨道；o 选择所有非零占据轨道。
1    # 保存当前拟合网格到 fitted.cub。
0
-1
0

# denfit 已返回主菜单，此处直接退出 Multiwfn。
[quit]
q
