#@doc module
# title.zh = 密度矩阵自然轨道
# title.en = Natural orbitals from density matrices
# summary.zh = 从 Gaussian .fch/.fchk 中指定的密度矩阵生成自然轨道，导出并重新载入当前目录的 new.mwfn。
# summary.en = Generate natural orbitals from a selected Gaussian .fch/.fchk density matrix, export new.mwfn and reload it.
# notes.zh = SCF、CI、RHO 每次模块调用选择其中一个；如需比较不同密度，应重新载入原始 .fch/.fchk，并在下一次生成前保存 new.mwfn。
# notes.zh = 输入必须实际含有所选密度矩阵。现有序列未回答非限制性、RO 等输入会出现的自然轨道类型提示，仅适用于不出现该额外提示的情况。
# notes.en = Choose one of SCF/CI/RHO per invocation; reload the original fch/fchk to compare another density and save new.mwfn before overwriting it. The requested matrix must exist. Unrestricted/RO inputs may introduce an extra natural-orbital-type prompt absent from this sequence.
#@end


#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 200 的子功能 16，等待输入要读取的密度矩阵类型。
# summary.en = Enter main function 200, subfunction 16, awaiting a density-matrix type.
#@end
[main]
200
16

#@doc section SCF
# title.zh = SCF 密度自然轨道
# title.en = SCF-density natural orbitals
# summary.zh = 从 Total SCF Density 生成自然轨道，并接受导出和重新载入 new.mwfn。
# summary.en = Generate natural orbitals from Total SCF Density, export and reload new.mwfn.
# notes.zh = 可作为密度差工作流的 SCF 参考；并非重新进行一次 SCF 计算。
# notes.en = Can supply the SCF reference for a density-difference workflow; this does not run SCF again.
#@end
[SCF]
SCF
y

#@doc section CI
# title.zh = CI 密度自然轨道
# title.en = CI-density natural orbitals
# summary.zh = 从 Total CI Density 生成自然轨道，导出并重新载入 new.mwfn；该密度必须已包含在输入文件中。
# summary.en = Generate natural orbitals from Total CI Density, export and reload new.mwfn. The matrix must be present in the input.
#@end
[CI]
CI
y

#@doc section RHO
# title.zh = CI Rho(1) 自然轨道
# title.en = CI Rho(1) natural orbitals
# summary.zh = 从 Total CI Rho(1) Density 生成自然轨道，导出并重新载入 new.mwfn。
# summary.en = Generate natural orbitals from Total CI Rho(1) Density, export and reload new.mwfn.
# notes.zh = 这里按密度矩阵名称读取，不接受激发态编号；要分析哪个态取决于输入文件中这份密度的内容。
# notes.en = Selection is by matrix name rather than excited-state index; the matrix in the input determines the state analyzed.
#@end
[RHO]
CI Rho(1)
y

# 从其他功能菜单返回主菜单并退出 Multiwfn。
[quit]
0
q
