#@doc module
# title.zh = 轨道重叠与对应
# title.en = Orbital overlaps and correspondence
# summary.zh = 比较两个波函数中的轨道对应关系，数值积分所选轨道之间的重叠，并按 itype 导出相应矩阵。
# summary.en = Compare two wavefunctions, numerically integrate orbital overlaps and export the matrix selected by itype.
# notes.zh = 当前 wfn 是第一个波函数，fch2 是第二个；两者须位于可比较的坐标系，程序不会在本步骤中自动对齐结构。
# notes.zh = 输出文本同时给出轨道对应关系；矩阵文件固定写入当前工作目录，本模块不生成 density.cub。
# notes.en = The loaded wfn is first, fch2 second. Use comparable coordinate frames; this section does not align geometries. Correspondence appears in text output; matrices use fixed filenames in the working directory. This module does not generate density.cub.
#@end

#@gui range
# label.zh = 两个波函数的轨道范围
# label.en = Orbital range for both wavefunctions
# type = text
# help.zh = 起止全局轨道编号，如 2,9；留空分别选择两份波函数的全部轨道。同一个 range 会发送两次，不能用此字段为两份波函数指定不同范围。
# help.en = Inclusive global index bounds, e.g. 2,9; blank selects all orbitals in each wavefunction. The same range is sent twice, so this field cannot set independent ranges.
#@end
#@gui fch2
# label.zh = 第二个波函数文件
# label.en = Second wavefunction file
# type = file
# help.zh = 须填写已存在且含轨道信息的第二个波函数路径，如 fragment.fch；原子坐标决定实际重叠，比较前应确认两份输入的相对位置。
# help.en = Existing second wavefunction containing orbitals, e.g. fragment.fch. Atomic coordinates determine the overlap; confirm the relative positioning of both inputs.
#@end
#@gui itype
# label.zh = 重叠积分输出类型
# label.en = Overlap integral output type
# type = text
# help.zh = -1 为有符号轨道重叠，写 convmat.txt；-2 为轨道绝对值的重叠，写 Snormmat.txt；-3 为轨道平方的重叠，写 Snorm2mat.txt。默认 -1。
# help.en = -1 exports signed orbital overlaps to convmat.txt; -2 exports absolute-value overlaps to Snormmat.txt; -3 exports overlaps of squared orbitals to Snorm2mat.txt. Default -1.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 200 的其他功能第二部分。
# summary.en = Enter main function 200, the second group of other functions.
#@end
[main]
200

#@doc section orb_integral
# title.zh = 轨道积分矩阵
# title.en = Orbital integral matrix
# summary.zh = 读取两个轨道范围和第二个波函数，计算对应关系并导出所选积分矩阵后返回。
# summary.en = Read two orbital ranges and the second wavefunction, compute correspondence, export the chosen integral matrix and return.
# notes.zh = 输出文件前三列依次为第一个波函数的轨道编号、第二个波函数的轨道编号及积分值。
# notes.en = The first three output columns are the first orbital index, second orbital index and integral value.
#@end
[orb_integral]
6
${range:-}      # 第一个波函数的起止编号，如 2,9；空值选择全部。
${fch2}
${range:-}      # 第二个波函数使用同一个范围参数；空值选择该文件的全部轨道。
${itype:--1}     # -1: 积分 psi_i*psi_j；-2: 积分 |psi_i*psi_j|；-3: 积分 psi_i^2*psi_j^2。
0               # 退出轨道对应关系分析；输出文件名由 itype 决定。

# 从其他功能菜单返回主菜单并退出 Multiwfn。
[quit]
0
q
