#@doc module
# title.zh = 波函数二维切面
# title.en = Wavefunction plane maps
# summary.zh = 从波函数直接计算并绘制实空间函数的二维填色图，用三个原子确定切面，可叠加原子标签和化学键。
# summary.en = Compute filled real-space plane maps directly from a wavefunction using three atom indices, with atom labels and bonds.
# notes.zh = 输入需含所计算函数所需的波函数信息；grid 是二维采样点数，plane 是原子编号。
# notes.zh = 两个绘图步骤都会保存图像并停留在绘图后处理菜单，单次选择一个步骤；以 end 结束时自动退出，以 wait 结束时交互接管后续调整。
# notes.zh = 名称中的 _wait 不会自动开启交互模式；图像默认名 dislin.png，扩展名由 Multiwfn 的图像格式设置决定。
# notes.en = Supply the wavefunction data required by the function; grid gives 2D sample counts and plane gives atom indices. Select one plotting step per block. Both save an image and stay in post-processing; end exits automatically and wait allows interactive adjustment. The _wait name does not enable interaction. Images default to dislin.png, with extension set by Multiwfn's format setting.
#@end

#@gui grid
# label.zh = 平面两个方向的网格点数
# label.en = Grid points along the two plane axes
# type = text
# help.zh = 默认 200,200，填写两个大于 1 的整数，以逗号分隔，例如 300,250。这里是平面两个方向的采样点数，不是三维网格的 1/2/3 精度档位；增大点数会增加计算和绘图开销。
# help.en = Default 200,200. Enter two integers greater than 1 separated by a comma, for example 300,250. These are sample counts along the two plane axes, not the 1/2/3 quality presets for 3D grids. Higher counts increase calculation and plotting cost.
#@end
#@gui plane
# label.zh = 定义平面的三个原子序号
# label.en = Three atom indices defining the plane
# type = text
# help.zh = 必填，输入三个不同且不共线的原子序号，以逗号分隔，如 1,2,6；编号从 1 开始并与当前输入文件一致。此处填写原子编号，不是坐标；三原子的顺序会影响图中的方向。
# help.en = Required: three distinct, non-collinear atom indices separated by commas, for example 1,2,6. Indices start at 1 and refer to the current input file. Enter atom indices, not coordinates; their order affects plot orientation.
#@end
#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 4 的二维实空间函数绘图菜单。
# summary.en = Enter main function 4 for two-dimensional real-space plots.
#@end
[main]
4

#@doc section spin_wait
# title.zh = 自旋密度切面
# title.en = Spin-density plane
# summary.zh = 绘制自旋密度 rho_alpha-rho_beta 的二维填色图，设置原子标签与键并保存图像；完成后留在后处理菜单等待操作。
# summary.en = Plot rho_alpha-rho_beta as a filled plane map with atom labels and bonds, save the image and remain in post-processing.
#@end
[spin_wait]
5
1    # Color-filled map
${grid:-200,200}
4    # Define by three atoms
${plane}
4    # ATOM
5
8    # BOND
14
0

#@doc section elf_wait
# title.zh = ELF 切面
# title.en = ELF plane
# summary.zh = 绘制电子定域化函数 ELF 的二维填色图（函数号 9，无量纲）；具体定义由 Multiwfn 的 ELFLOL_type 设置决定。
# summary.en = Plot dimensionless ELF (function 9); the definition follows ELFLOL_type.
# notes.zh = 设置原子标签与键并保存图像后留在后处理菜单，使用 wait 可继续交互调整。
# notes.en = Add atom labels and bonds, save the image and remain in post-processing. Use wait for interactive adjustment.
#@end
[elf_wait]
9
1    # Color-filled map
${grid:-200,200}
4    # Define by three atoms
${plane}
4    # ATOM
5
8    # BOND
14
0

# 从绘图后处理菜单返回主菜单并退出；使用 wait 时不会执行此段，可自行调整图像后退出。
[quit]
-5
q
