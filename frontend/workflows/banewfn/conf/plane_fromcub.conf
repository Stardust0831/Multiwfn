#@doc module
# title.zh = Cube 二维切面
# title.en = Cube plane maps
# summary.zh = 从已加载的 cube 网格插值取得二维切面并绘制填色图；保留源 cube 的函数含义、数值单位及正负号。
# summary.en = Interpolate a 2D plane from a loaded cube, retaining the function, units and signs.
# notes.zh = 输入必须是目标 cube；接在网格生成任务后使用时，通过 wfn_rebase 指向生成的 cube，再填写 plane 的三个原子编号。
# notes.zh = autoplot 用于导出切面数据和图像，drawplot 用于保存初图后交互调整；图像默认 dislin.png，扩展名随图像格式设置变化。
# notes.zh = 三个原子确定的切面应处于源 cube 覆盖的空间范围内；增大二维采样点数不会提高原始三维数据的精度。
# notes.en = Load the target cube; after a grid-generation task, use wfn_rebase to select it, then give plane's three atom indices. autoplot exports data and an image; drawplot saves the initial image for interactive adjustment. Images default to dislin.png with the configured extension. Keep the plane within the source grid. Denser 2D sampling cannot recover missing 3D resolution.
#@end

#@gui grid
# label.zh = 平面两个方向的网格点数
# label.en = Grid points along the two plane axes
# type = text
# help.zh = 默认 200,200，填写两个大于 1 的整数，以逗号分隔，例如 300,250。这里是平面两个方向的采样点数，不是三维网格的 1/2/3 精度档位；增大点数会增加计算和绘图开销。仅提高切面采样密度，不能补回原 cube 缺失的分辨率。
# help.en = Default 200,200. Enter two integers greater than 1 separated by a comma, for example 300,250. These are sample counts along the two plane axes, not the 1/2/3 quality presets for 3D grids. Higher counts increase calculation and plotting cost. Denser plane sampling cannot recover resolution absent from the source cube.
#@end
#@gui plane
# label.zh = 定义平面的三个原子序号
# label.en = Three atom indices defining the plane
# type = text
# help.zh = 必填，输入三个不同且不共线的原子序号，以逗号分隔，如 1,2,6；编号从 1 开始并与当前输入文件一致。此处填写原子编号，不是坐标；三原子的顺序会影响图中的方向。cube 必须包含这些原子的结构信息。
# help.en = Required: three distinct, non-collinear atom indices separated by commas, for example 1,2,6. Indices start at 1 and refer to the current input file. Enter atom indices, not coordinates; their order affects plot orientation. The cube must contain these atoms.
#@end
#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 将用户自定义函数设为 -1（对当前三维网格插值），然后进入二维绘图菜单。
# summary.en = Set user-defined function -1 for interpolation from the loaded grid and enter 2D plotting.
#@end
[main]
1000
2
-1
4

#@doc section autoplot
# title.zh = 绘图并导出数据
# title.en = Plot and export data
# summary.zh = 绘制并保存填色图，导出 plane.txt，再回到二维函数选择菜单，可继续同类步骤。
# summary.en = Save the filled plane map and plane.txt, then return to function selection for similar steps.
# notes.zh = plane.txt 第 1–3 列为三维 X/Y/Z，第 4/5 列为图内坐标（均为 Angstrom），第 6 列为原 cube 的函数值。
# notes.en = plane.txt columns 1-3 are 3D X/Y/Z, columns 4-5 are plot coordinates (all Angstrom), and column 6 is the source function value.
#@end
[autoplot]
100
1    # Color-filled map
${grid:-200,200}
4    # Define by three atoms
${plane}
4    # ATOM
5
8    # BOND
14
0
-6   # plane.txt
-5
4

#@doc section drawplot
# title.zh = 交互调整切面
# title.en = Adjust plane interactively
# summary.zh = 保存切面填色图并停留在后处理菜单，供调整色标、标签和视角；本段不导出 plane.txt。
# summary.en = Save a filled plane map and stay in post-processing for scale, label and viewpoint adjustment; no plane.txt is exported.
# notes.zh = 作为本模块最后一个步骤并用 wait 接管；名称本身不切换交互模式，直接沿用非交互 quit 不能正确返回。
# notes.en = Put this section last and use wait. Its name does not enable interaction; the noninteractive quit sequence cannot return correctly from this state.
#@end
[drawplot]
100
1    # Color-filled map
${grid:-200,200}
4    # Define by three atoms
${plane}
4    # ATOM
5
8    # BOND
14
0

# 从二维函数选择菜单返回主菜单并退出；适用于 autoplot 完成后的状态。
[quit]
-10
q
