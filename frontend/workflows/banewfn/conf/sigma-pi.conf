#@doc module
# title.zh = 平面体系 π 轨道 LOL
# title.en = Planar pi-orbital LOL
# summary.zh = 识别平面体系的 pi 轨道并调整内存中的占据数，再绘制所保留轨道贡献的 LOL 二维填色图。
# summary.en = Identify pi orbitals of planar systems, change in-memory occupations and plot LOL from retained orbitals.
# notes.zh = 当前固定选择离域轨道模式，适用于严格平面且能识别为平行 XY/XZ/YZ 的构型；任意转向或非平面结构会要求额外输入。
# notes.zh = 不导出修改后的波函数文件。clean 决定保留哪些轨道，绘图用的 plane 只定义切面，不负责旋转体系或定义 pi 轨道识别平面。
# notes.zh = lol-pi 与 lol-pi-wait 的当前命令完全相同，都停留绘图后处理菜单；本模块没有 quit 段，宜一次选择一个绘图步骤并用 wait 接管。
# notes.en = The fixed delocalized-orbital mode requires a strictly planar geometry recognized as parallel to XY/XZ/YZ; arbitrary orientations or nonplanar structures need extra answers. No modified wavefunction is exported. clean selects retained orbitals; plane sets the plot slice without rotating the geometry or defining the identification plane. lol-pi and lol-pi-wait run identical commands and remain in post-processing. There is no quit section; select one plot and use wait.
#@end

#@gui clean
# label.zh = 置零占据数的轨道范围
# label.en = Orbitals whose occupations are zeroed
# type = text
# help.zh = 默认 2=将识别出的 pi 轨道以外所有轨道占据数置零，保留 pi 贡献；1=置零 pi 轨道，保留其他轨道；0=不修改。当前离域轨道模式还可能提供 3/4 以处理价层 pi 轨道，需结合实际菜单判断。只改本次会话内存中的占据数。
# help.en = Default 2 zeroes occupations of all orbitals except detected pi orbitals, retaining pi contributions. 1 zeroes pi occupations; 0 leaves occupations unchanged. In the current delocalized-orbital mode, options 3/4 may also be available for valence pi orbitals; consult the actual menu. Only occupations in the current session are changed.
#@end
#@gui grid
# label.zh = 平面两个方向的网格点数
# label.en = Grid points along the two plane axes
# type = text
# help.zh = 默认 200,200，填写两个大于 1 的整数，以逗号分隔，例如 300,250。这里是平面两个方向的采样点数，不是三维网格的 1/2/3 精度档位；增大点数会增加计算和绘图开销。
# help.en = Default 200,200. Enter two integers greater than 1 separated by a comma, for example 300,250. These are sample counts along the two plane axes, not the 1/2/3 quality presets for 3D grids. Higher counts increase calculation and plotting cost.
#@end
#@gui plane
# label.zh = 定义平面的三个原子序号
# label.en = Three atom indices defining the plane
# type = text
# help.zh = 必填，输入三个不同且不共线的原子序号，以逗号分隔，如 1,2,6；编号从 1 开始并与当前输入文件一致。此处填写原子编号，不是坐标；三原子的顺序会影响图中的方向。
# help.en = Required: three distinct, non-collinear atom indices separated by commas, for example 1,2,6. Indices start at 1 and refer to the current input file. Enter atom indices, not coordinates; their order affects plot orientation.
#@end
#@doc section main
# title.zh = 识别轨道并调整占据
# title.en = Identify orbitals and set occupations
# summary.zh = 进入其他功能 100/22，以离域轨道模式自动识别 pi 轨道，按 clean 修改占据数，再返回主菜单。
# summary.en = Enter 100/22, identify pi orbitals in delocalized mode, modify occupations according to clean and return to the main menu.
#@end
[main]
100
22
0
${clean:-2} # 1: remove pi 2: remove sigma
0

#@doc section lol-pi
# title.zh = 绘制 π 轨道 LOL
# title.en = Plot pi-orbital LOL
# summary.zh = 用修改占据数后的波函数计算 LOL（函数号 10），绘制并保存填色图；clean=2 时对应 pi 轨道贡献。
# summary.en = Compute LOL (function 10) with the modified occupations and save a filled map; clean=2 selects pi contributions.
# notes.zh = 输出默认 dislin.png，结束时仍在绘图后处理菜单，需 wait 交互接管。
# notes.en = Output defaults to dislin.png. Remains in post-processing and needs interactive wait.
#@end
[lol-pi]
4
10
1    # Color-filled map
${grid:-200,200}
4    # Define by three atoms
${plane}
4    # ATOM
5
8    # BOND
14
0

#@doc section lol-pi-wait
# title.zh = 绘制并交互调整
# title.en = Plot and adjust interactively
# summary.zh = 与 lol-pi 执行相同命令：保存当前保留轨道贡献的 LOL 填色图并留在后处理菜单。
# summary.en = Run the same commands as lol-pi: save the retained-orbital LOL map and stay in post-processing.
# notes.zh = 步骤名中的 wait 不会自动开启交互模式，应由工作流块的 wait 控制。
# notes.en = The name does not enable interaction; control it with the workflow block's wait.
#@end
[lol-pi-wait]
4
10
1    # Color-filled map
${grid:-200,200}
4    # Define by three atoms
${plane}
4    # ATOM
5
8    # BOND
14
0
