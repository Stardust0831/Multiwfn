#@doc module
# title.zh = 电子光谱导出
# title.en = Electronic spectra
# summary.zh = 电子光谱数据导出：从含激发能与强度的计算输出生成 UV-Vis 或 ECD 曲线、离散谱线。
# summary.en = Export UV-Vis/ECD curves and discrete lines from calculation output containing excitation energies and intensities.
# notes.zh = 启动文件应为计算输出（如 Gaussian .out/.log），不是缺少光谱信息的 fch 或普通结构文件。
# notes.zh = 各数据段导出 spectrum_curve.txt 和 spectrum_line.txt 后重新进入光谱类型选择；固定文件名会被后一次导出覆盖。
# notes.zh = ECD 段含“选择速度表象”的固定回答，适用于出现该提示的输出格式；其他程序的读取顺序可能不同。
# notes.zh = quit 会再进入一次 UV-Vis 读取路径后退出，因此启动文件还须支持该路径及其提示顺序。
# notes.en = Load output such as Gaussian .out/.log rather than an fch or geometry lacking spectra. Sections overwrite spectrum_curve.txt and spectrum_line.txt and return to spectrum-type selection. ECD includes a fixed velocity-gauge answer; other program formats may prompt differently. quit enters the UV-Vis reading route again before exiting, so the input must also support that route and prompt order.
#@end


#@gui FWHM
# label.zh = 半峰全宽
# label.en = Full width at half maximum
# type = number
# unit = eV
# help.zh = ECD 展宽的半峰全宽，填写正的能量宽度，单位 eV。即使横轴显示 nm，Multiwfn 也先在能量坐标展宽；这里不能填写波长宽度。
# help.en = Full width at half maximum for ECD broadening, as a positive energy width in eV. Even with a wavelength axis in nm, Multiwfn broadens in energy first; do not enter a wavelength width.
#@end
#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主菜单 11，等待选择光谱类型。
# summary.en = Enter main menu 11, awaiting a spectrum type.
#@end
[main]
11

#@doc section uvvis-data
# title.zh = UV-Vis 数据
# title.en = UV-Vis data
# summary.zh = 选择 UV-Vis，按 Multiwfn 当前展宽导出曲线和离散谱线；默认横轴为波长 nm。
# summary.en = Select UV-Vis and export curves and lines using current broadening; the default horizontal axis is wavelength in nm.
# notes.zh = 导出后返回主菜单，再进入光谱类型选择，供下一个光谱段使用。
# notes.en = Return through the main menu to spectrum-type selection for another section.
#@end
[uvvis-data]
3
2
-3
11

#@doc section ecd-data
# title.zh = ECD 数据
# title.en = ECD data
# summary.zh = 选择 ECD 和速度表象的旋光强度，按当前展宽导出曲线和离散谱线。
# summary.en = Select ECD with velocity-gauge rotatory strengths and export curves and lines using current broadening.
#@end
[ecd-data]
4
2
2
-3
11

#@doc section ecd-fwhm
# title.zh = 设置展宽并导出 ECD
# title.en = ECD with chosen broadening
# summary.zh = 选择 ECD 和速度表象，先设置展宽半峰全宽 FWHM，再导出曲线和离散谱线。
# summary.en = Select velocity-gauge ECD, set the broadening FWHM, then export curves and lines.
#@end
[ecd-fwhm]
4
2
8
${FWHM:-0.8}
2
-3
11

# 从各数据段结束后的光谱类型选择处，先选择 UV-Vis，再用 -3 返回主菜单并退出。
# 若输入文件读取 UV-Vis 时出现额外提示或不含所需数据，这个固定退出序列需相应调整。
[quit]
3
-3
q
