#@doc module
# title.zh = 扫描隧道显微图像
# title.en = Scanning tunneling microscopy
# summary.zh = STM 图像：计算扫描平面上的隧穿电流模型，并按当前图像格式保存二维图，文件以 dislin 为前缀。
# summary.en = Calculate a tunneling-current model on a scan plane and save a 2D dislin image in the current format.
# notes.zh = 需要含 Gaussian 基函数、轨道及能量信息的波函数；非整数占据和受限开壳层须按 Multiwfn 要求预处理。
# notes.zh = 首次进入默认使用恒高度模式；扫描平面、网格和费米能沿用 STM 当前设置。
# notes.zh = mod_volt 指定偏压，direct 沿用当前偏压，通常择一使用；这些步骤没有导出 STM.txt 或 STM.cub。
# notes.zh = 步骤保存图像后仍停留在二维绘图菜单。本配置没有 [quit]，驱动补入的 q 不能替代该菜单的数字返回操作。
# notes.zh = 用于无人值守工作流前须补全返回与退出命令；当前模板需要交互收尾，不宜直接接续其他分析步骤。
# notes.zh = 作图命令假定化学键原先隐藏：若已显示，菜单 5 会关闭化学键且不再询问颜色，后续输入将错位。
# notes.en = Requires Gaussian basis functions, orbitals and energies; preprocess fractional occupations and restricted open shells as required by Multiwfn. Initial entry defaults to constant-height mode and retains the scan plane, grid and Fermi energy. Choose mod_volt for a bias or direct for the current bias; neither exports STM.txt or STM.cub. Both remain in the 2D plotting menu. There is no quit section; the driver's q cannot replace numeric menu returns. Supply return/exit commands before unattended use; this template needs interactive finishing. Plot commands assume bonds are initially hidden; otherwise menu 5 disables them without a color prompt and shifts subsequent inputs.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 从 Multiwfn 主菜单进入 STM 模拟设置界面。
# summary.en = Enter STM simulation settings from the Multiwfn main menu.
#@end
[main]
300
4

#@doc section mod_volt
# title.zh = 指定偏压绘图
# title.en = Plot at chosen bias
# summary.zh = 设置偏压后计算平面数据，显示棕色化学键，保存填色图与等值线；保存后仍停留在绘图菜单。
# summary.en = Set the bias, compute plane data, display brown bonds and save a filled/contour map. Remain in the plotting menu afterwards.
#@end
[mod_volt]
#@gui volt
# label.zh = STM 偏压
# label.en = STM bias voltage
# type = text
# help.zh = 偏压，单位 V，例如 -3.5。负值对应电子从样品流向针尖、显示占据轨道贡献；正值对应未占据轨道贡献，须有可用虚轨道。
# help.en = Bias in V, for example -3.5. Negative values image occupied-orbital contributions as electrons flow from sample to tip; positive values image unoccupied orbitals and require available virtual orbitals.
# unit = V
#@end
2
${volt}
0
5           # 显示化学键
14          # 用棕色
2           # 修改图像类型
2           # 填色图+等值线
7           # 修改坐标轴的刻度间隔
1.5,1.5,0.002
-3          #其它作图设置
8           # 修改原子标签大小
70
0
1

#@doc section direct
# title.zh = 沿用当前偏压
# title.en = Use current bias
# summary.zh = 沿用 STM 当前偏压计算并保存图像；有虚轨道时，初始偏压通常选择 HOMO 贡献。
# summary.en = Compute and save an image at the current STM bias; with virtual orbitals available, the initial bias commonly selects HOMO contributions.
# notes.zh = 图像样式与 mod_volt 相同，保存后仍停留在绘图菜单。
# notes.en = Uses mod_volt's image style and remains in the plotting menu.
#@end
[direct]
0
5           # 显示化学键
14          # 用棕色
2           # 修改图像类型
2           # 填色图+等值线
7           # 修改坐标轴的刻度间隔
1.5,1.5,0.002
-3          #其它作图设置
8           # 修改原子标签大小
70
0
1
