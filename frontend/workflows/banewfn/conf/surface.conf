#@doc module
# title.zh = 分子表面分析
# title.en = Molecular surface analysis
# summary.zh = 分子表面定量分析：在电子密度等值面上计算 ESP、ALIE 或 LEAE，定位表面极值并导出 PDB 标记。
# summary.en = Analyze ESP, ALIE or LEAE on an electron-density isosurface, locate extrema and export PDB markers.
# notes.zh = 从当前波函数直接生成表面；ALIE 需要轨道能量，LEAE 还需要能量为负的虚轨道，不能仅加载显示用的 cube 代替波函数。
# notes.zh = surfanalysis.pdb 记录极值坐标，B-factor 栏记录函数值；单位见文件 REMARK。
# notes.zh = ESP 通常用 kcal/mol，数值超出 PDB 字段范围时自动改用 eV；ALIE/LEAE 用 eV。
# notes.zh = 各分析步骤都会重建表面并复用 surfanalysis.pdb，组合或重复执行时应先收集或改名。
# notes.zh = 进入主功能 12 的分子表面定量分析菜单。
# notes.en = Generate the surface from a wavefunction; ALIE needs orbital energies and LEAE also negative-energy virtual orbitals. A display cube alone is insufficient. surfanalysis.pdb records extrema and values in B-factor; see REMARK for units. ESP usually uses kcal/mol, switching to eV if values exceed PDB field width; ALIE/LEAE use eV. Each step rebuilds the surface and overwrites surfanalysis.pdb, so rename or collect between steps.
#@end

#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 执行本模块的初始化命令。
# summary.en = Enter main function 12 for quantitative molecular surface analysis.
#@end
[main]
12

#@doc section espext
# title.zh = 表面静电势极值
# title.en = Surface ESP extrema
# summary.zh = 在默认 rho=0.001 a.u. 等值面上分析总静电势，将生成表面的网格步长设为 0.15 Bohr。
# summary.en = Analyze total ESP at the default rho=0.001 a.u.
# notes.zh = 导出 mol.pdb（分子）、vtx.pdb（全部表面顶点）和 surfanalysis.pdb（表面极值）；统计量写入运行输出。
# notes.en = surface with generation spacing 0.15 Bohr. Export mol.pdb (molecule), vtx.pdb (all vertices) and surfanalysis.pdb (extrema); print statistics in the log.
#@end
[espext]
3
0.15
0
5
mol.pdb
6
2
-1
-1
12

#@doc section alieext
# title.zh = 表面 ALIE 极值
# title.en = Surface ALIE extrema
# summary.zh = 在 iso 指定的电子密度等值面上分析平均局部电离能 ALIE；默认 rho=0.0005 a.u.。
# summary.en = Analyze ALIE on the density surface selected by iso, default rho=0.0005 a.u.
# notes.zh = 导出 surfanalysis.pdb，B-factor 的 ALIE 单位为 eV；数值较低的表面区域对应较易失去电子的位置。
# notes.en = Export surfanalysis.pdb with ALIE B-factors in eV. Lower ALIE regions lose electrons more readily.
#@end
[alieext]
#@gui iso
# label.zh = ALIE 表面的密度等值
# label.en = Density isovalue for ALIE surface
# type = text
# unit = e/Bohr^3
# help.zh = 定义所分析的电子密度等值面，默认 0.0005 a.u.；输入正实数，数值越小通常表面越向外扩展。这里设置的是电子密度阈值，不是 ALIE 数值或网格步长。
# help.en = Positive electron-density isovalue defining the analyzed surface; default 0.0005 a.u. A lower value generally extends the surface outward. This is a density threshold, not an ALIE value or grid spacing.
#@end
1               # Select the way to define surface
1               #  Isosurface of electron density
${iso:-0.0005}
2               # Select mapped function
2               # Average local ionization energy (ALIE)
0
2
-1
-1
12

#@doc section leaeext
# title.zh = 表面 LEAE 极值
# title.en = Surface LEAE extrema
# summary.zh = 分析局部电子附着能 LEAE，导出 surfanalysis.pdb；B-factor 的 LEAE 单位为 eV。
# summary.en = Analyze LEAE and export surfanalysis.pdb with B-factors in eV.
# notes.zh = 当前 Multiwfn 在选择 LEAE 映射函数时会把密度等值面重设为 0.004 a.u.，因此此前填写的 iso 不会改变最终表面。
# notes.en = Selecting LEAE resets the density isovalue to 0.004 a.u. in Multiwfn, so an earlier iso value does not control the final surface.
#@end
[leaeext]
#@gui iso
# label.zh = LEAE 表面的初始密度等值
# label.en = Initial density isovalue for LEAE surface
# type = text
# unit = e/Bohr^3
# help.zh = 原模板默认 0.004 a.u.，单位 e/Bohr^3。此输入在选择 LEAE 之前发出；当前 Multiwfn 随后会强制重设为 0.004，因此仅修改本字段不生效。需要其他等值面时须调整原始菜单输入顺序。
# help.en = Original template default 0.004 a.u., in e/Bohr^3. This input precedes selection of LEAE, which currently resets the isovalue to 0.004 in Multiwfn. Changing this field alone has no effect; another isovalue requires revising the raw menu input order.
#@end
1               # Select the way to define surface
1               #  Isosurface of electron density
${iso:-0.004}
2               # Select mapped function
-4               # Local electron attachment energy (LEAE)
0
2
-1
-1
12

# 返回主菜单并退出 Multiwfn。
[quit]
-1
q

# espext 步骤的分子表面算法参考文献绑定。
[citations]
lu_espext_2012 @espext
