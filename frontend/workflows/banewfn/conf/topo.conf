#@doc module
# title.zh = 电子密度拓扑
# title.en = Electron-density topology
# summary.zh = 电子密度拓扑分析：从核位置与原子对中点搜索临界点（CP），可查看结构并导出各临界点的实空间性质。
# summary.en = Search critical points from nuclei and atom-pair midpoints, view them and export their real-space properties.
# notes.zh = 输入需包含计算密度及其导数的波函数信息。这里固定使用默认电子密度，不提供其他拓扑函数或搜索范围参数。
# notes.zh = 这两类起点不能保证找全所有临界点，尤其环/笼临界点；本模板也未生成连接临界点的路径。
# notes.zh = Ehb 示例脚本读取本模块的 CPprop.txt 后另行选择 CP 并做经验能量估算；topo 本身只搜索、显示和输出性质。
# notes.zh = 进入主功能 2，依次从核位置和原子对中点搜索电子密度临界点；工作流自动执行此初始化段。
# notes.en = Requires density and derivative evaluation. Uses the default electron density, without a function/range parameter. These starts do not guarantee all critical points, especially ring/cage points; no connecting paths are generated. Ehb workflows select points from CPprop.txt and estimate energies separately; topo itself searches, displays and exports properties.
#@end

#@doc section main
# title.zh = 搜索临界点
# title.en = Search critical points
# summary.zh = 执行本模块的初始化命令。
# summary.en = Enter main function 2 and search density critical points from nuclei and atom-pair midpoints; workflows execute this initialization automatically.
#@end
[main]
2
2
3

#@doc section view
# title.zh = 查看临界点
# title.en = View critical points
# summary.zh = 打印并显示已找到的临界点及已有拓扑对象；有图形界面时需关闭或操作显示窗口，不自动生成图片或 CPprop.txt。
# summary.en = Print and display the found critical points and existing topology objects. With graphics, operate or close the display window. Does not automatically save images or CPprop.txt.
#@end
[view]
0

#@doc section realspace
# title.zh = 导出临界点性质
# title.en = Export critical-point properties
# summary.zh = 对全部已找到的临界点输出实空间性质，默认文件为 CPprop.txt，包括密度、拉普拉斯、能量密度等。
# summary.en = Export real-space properties of all found critical points to CPprop.txt, including density, Laplacian and energy densities.
# notes.zh = 使用固定选项 0，包含较耗时的静电势计算；重复运行会覆盖同名文件。
# notes.en = The fixed choice 0 includes costly ESP evaluation. Repetition overwrites the file.
#@end
[realspace]
7
0

# 从拓扑菜单返回主菜单并退出 Multiwfn。
[quit]
-10
q

# 本模块初始化步骤的参考文献绑定，供 Ehb 相关工作流沿用。
[citations]
emamian_ehb_2019 @main
