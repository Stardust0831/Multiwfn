#@doc module
# title.zh = 弱相互作用可视化
# title.en = Interaction visualization
# summary.zh = 相互作用可视化：计算 NCI/RDG、IRI、IGM 或 IGMH，并导出散点图和三维 cube 数据。
# summary.en = Generate NCI/RDG, IRI, IGM or IGMH scatterplots and cubes.
# notes.zh = NCI、IRI、IGMH 需要含轨道的波函数。此处 igm 还预留了真实/预分子密度选择，不能直接用只有坐标的文件代替波函数。
# notes.zh = IGM 用自由原子密度构造梯度模型；IGMH 使用真实分子密度的 Hirshfeld 分区。片段定义决定区分哪些片段间/片段内相互作用。
# notes.zh = 输出文件名在各步骤间复用，组合多个步骤时需及时收集或改名。图像默认为 dislin.png，扩展名随 Multiwfn 图像格式设置变化。
# notes.zh = 当前默认 IGMvdwscl=2 按片段间区域预筛选，仅导出 sl2r.cub 和 dg_inter.cub；设为 0 才额外导出 dg_intra.cub 和 dg.cub。
# notes.zh = 单片段时非零预筛选会排除全部网格；需要整体或完整片段内分析时，应在 Multiwfn 设置中使用 IGMvdwscl=0。
# notes.zh = 现有 IGM/IGMH 序列中的 1、2 保存片段内散点图，未导出 output.txt；非零预筛选下该图不能代表完整片段内分布。
# notes.en = NCI, IRI and IGMH need orbitals; igm retains a real/promolecular-density choice and cannot directly use geometry-only input. IGM builds its gradient model from free atoms; IGMH partitions the molecular density by Hirshfeld atoms. Fragment definitions control inter/intrafragment terms. Collect or rename reused filenames between analyses. Images default to dislin.png with the configured extension. Default IGMvdwscl=2 screens interfragment regions, exporting sl2r.cub and dg_inter.cub; 0 also exports dg_intra.cub and dg.cub. Nonzero screening excludes every grid point for a single fragment. Use IGMvdwscl=0 for whole-system/full intrafragment analysis. The fixed IGM/IGMH choices 1,2 save intrafragment scatterplots without output.txt; under screening they do not show the complete intrafragment distribution.
#@end

#@gui grid
# label.zh = 三维网格设置
# label.en = 3D grid setup
# type = text
# help.zh = 默认 2（中等精度）；常用 1/2/3 为低/中/高精度，控制三维采样密度及计算量。Multiwfn 也支持自定义点数、步长、盒范围、沿用 cube 等模式；这些模式需要在原始输入或扩展模板中补全后续回答，不能只填菜单号。
# help.en = Default 2 (medium); common presets 1/2/3 mean low/medium/high and control sampling density and cost. Multiwfn also supports custom point counts, spacing, boxes, or another cube grid. Those modes require all follow-up answers in raw input or an extended template; a menu number alone is insufficient.
#@end
#@doc section main
# title.zh = 初始化
# title.en = Initialize
# summary.zh = 进入主功能 20 的弱相互作用分析菜单。
# summary.en = Enter main function 20 for weak-interaction analysis.
#@end
[main]
20

#@doc section nci
# title.zh = NCI 与 RDG
# title.en = NCI and RDG
# summary.zh = 基于真实电子密度计算 NCI/RDG，输出 func1.cub=sign(lambda2)*rho、func2.cub=RDG。
# summary.en = Compute NCI/RDG from the molecular density.
# notes.zh = 同时保存散点图与 output.txt；文本第 1–3 列为 X/Y/Z（Angstrom），第 4/5 列为着色量/RDG。
# notes.en = Export func1.cub=sign(lambda2)*rho, func2.cub=RDG, a scatterplot and output.txt. Text columns 1-3 are X/Y/Z (Angstrom), columns 4-5 the coloring quantity and RDG.
#@end
[nci]
1
${grid:-2}
1
2
3
0

#@doc section iri
# title.zh = 相互作用区域指示函数
# title.en = Interaction region indicator
# summary.zh = 计算相互作用区域指示函数 IRI，用于显示共价成键与非共价相互作用区域。
# summary.en = Compute IRI for covalent and noncovalent regions.
# notes.zh = 输出 func1.cub=sign(lambda2)*rho、func2.cub=IRI、散点图及 output.txt；文本第 1–3 列为 X/Y/Z（Angstrom），第 4/5 列为着色量/IRI。
# notes.en = Export func1.cub=sign(lambda2)*rho, func2.cub=IRI, a scatterplot and output.txt. Columns 1-3 are X/Y/Z (Angstrom), columns 4-5 the coloring quantity and IRI.
#@end
[iri]
4
${grid:-2}
1
2
3
0

#@doc section igm
# title.zh = 单片段 IGM
# title.en = Single-fragment IGM
# summary.zh = 对整个体系定义一个片段并运行原始 IGM；denstiy 仅选择 sign(lambda2)*rho 着色量所用的密度，不会把 IGM 改为 IGMH。
# summary.en = Define the whole system as one fragment and run original IGM.
# notes.zh = 单片段分析需使用 IGMvdwscl=0；当前默认非零值会筛掉全部网格。关闭筛选后导出四个 cube 和片段内散点图，其中 dg_inter 为零。
# notes.en = denstiy selects only the density used for sign(lambda2)*rho coloring; it does not turn IGM into IGMH. Use IGMvdwscl=0: the nonzero default excludes all points for one fragment. Without screening, export four cubes and the intrafragment scatterplot; dg_inter is zero.
#@end
[igm]
#@gui denstiy
# label.zh = IGM 着色所用密度
# label.en = Density used to color IGM
# type = text
# help.zh = 键名沿用 denstiy。1=真实电子密度，2=自由原子密度叠加的预分子密度（默认）。只改变 sign(lambda2)*rho；不是选择 Hirshfeld 分区。该提问仅在输入含波函数时出现，因此本模板 igm 需要波函数输入。
# help.en = The existing key is denstiy. 1 uses actual electron density; 2 uses promolecular density (default). This only selects sign(lambda2)*rho, not Hirshfeld partitioning. Multiwfn asks this question only for wavefunction input, which this igm sequence therefore requires.
#@end
10
1
a
${denstiy:-2}        # 1=真实电子密度 2=预分子密度（仅控制着色量）
${grid:-2}
1
2
3
0

#@doc section igmh
# title.zh = 单片段 IGMH
# title.en = Single-fragment IGMH
# summary.zh = 将全部原子设为一个片段，运行 IGMH；单片段需 IGMvdwscl=0，当前默认非零值会筛掉全部网格。
# summary.en = Define all atoms as one fragment and run IGMH.
# notes.zh = 关闭筛选后导出四个 cube 和片段内散点图，dg_inter 为零；两分子或基团之间的分析应使用 igmh_f 或 igmh_f2。
# notes.en = Use IGMvdwscl=0: the nonzero default excludes all grid points. Without screening, export four cubes and the intrafragment scatterplot with zero dg_inter. For two molecules/groups use igmh_f or igmh_f2.
#@end
[igmh]
11
1
a
${grid:-2}
1
2
3
0

#@doc section igmh_f
# title.zh = 列表定义片段的 IGMH
# title.en = IGMH with a fragment list
# summary.zh = 按 frag* 列表逐项定义片段，片段数由 len(frag) 得到；每个列表元素展开为一行原子序号。
# summary.en = Define fragments from frag*, one atom-index line per list item, with count len(frag).
# notes.zh = 默认导出 sl2r.cub、dg_inter.cub；IGMvdwscl=0 时另导出 dg_intra.cub、dg.cub。只计算片段原子的并集。
# notes.zh = 固定保存片段内散点图；要完整分析片段内分布或只定义一个片段，需先关闭片段间预筛选。
# notes.en = Compute only the union of selected atoms. Export sl2r.cub and dg_inter.cub by default; IGMvdwscl=0 adds dg_intra.cub and dg.cub. Save the intrafragment scatterplot. Disable interfragment screening for a full intrafragment distribution or a single fragment.
#@end
[igmh_f]
#@gui len(frag)
# label.zh = 片段列表长度
# label.en = Fragment list length
# type = text
# help.zh = 通常由脚本中的整组列表 frag* 自动求长度，至少包含一个片段；例如 frag*=("1-6" "7-12") 对应 2。普通 frag=(...) 会逐项扫描，不能代替整组列表。若覆盖此值，必须与 frag* 展开的行数一致。
# help.en = Normally derived from the whole-list variable frag*, with at least one fragment; for example frag*=("1-6" "7-12") gives 2. Ordinary frag=(...) scans entries separately and is not equivalent. An explicit override must match the number of lines expanded by frag*.
#@end
#@gui frag*
# label.zh = 全部片段的原子序号列表
# label.en = Atom selections for all fragments
# type = text
# help.zh = 由 frag* 整组列表展开，每个元素是一片段，如 frag*=("1-6" "7,9-12")；原子从 1 编号。单片段可用 a 表示全部原子，但需关闭 IGMvdwscl 预筛选；最后一片段可用 c 表示其余原子。片段应避免重叠。
# help.en = Expanded from the whole-list variable frag*, for example frag*=("1-6" "7,9-12"), with one selection per element and atom indices starting at 1. For one fragment, a selects all atoms but requires IGMvdwscl=0. For the last fragment, c selects remaining atoms. Avoid overlaps.
#@end
11
${len(frag)}
${frag*}
${grid:-2}
1
2
3
0

#@doc section igmh_f2
# title.zh = 双片段 IGMH
# title.en = Two-fragment IGMH
# summary.zh = 用 frag1、frag2 明确定义两个片段，运行 IGMH；dg_inter.cub 描述两片段之间的相互作用。
# summary.en = Define frag1 and frag2 and compute IGMH; dg_inter.cub describes their interaction.
# notes.zh = 默认还导出 sl2r.cub；IGMvdwscl=0 时额外导出 dg_intra.cub、dg.cub。本段未导出 output.txt。
# notes.zh = 固定保存片段内散点图，当前默认片段间预筛选下不能将该图作为完整片段内分析结果。
# notes.en = Also export sl2r.cub by default, adding dg_intra.cub and dg.cub when IGMvdwscl=0. Does not export output.txt. Saves an intrafragment scatterplot, which is incomplete under the default interfragment screening.
#@end
[igmh_f2]
#@gui frag1
# label.zh = 片段 1 的原子序号
# label.en = Atom indices of fragment 1
# type = text
# help.zh = 必填，使用从 1 开始的原子序号，可用逗号和区间，如 1-6 或 1,3,5-8；空默认值不代表自动选取。应与片段 2 不重叠。
# help.en = Required atom indices starting at 1, using commas and ranges such as 1-6 or 1,3,5-8. The empty default is not an automatic selection. Do not overlap fragment 2.
#@end
#@gui frag2
# label.zh = 片段 2 的原子序号
# label.en = Atom indices of fragment 2
# type = text
# help.zh = 必填，格式同片段 1，如 7-12；也可填 c 选择未包含在片段 1 中的所有原子。只计算两片段的原子并集。
# help.en = Required, in the same format as fragment 1, for example 7-12. Enter c to select all atoms outside fragment 1. Only the union of the defined fragments is included.
#@end
11
2
${frag1:-}
${frag2:-}
${grid:-2}
1
2
3
0

# 返回主菜单并退出 Multiwfn。
[quit]
0
q
